<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>长度单位换算</title>
<link rel="stylesheet" href="../common/play.css">
</head>
<body>
<div id="app"></div>
<template id="homeExtra">
  <h2 class="sec">一、认识 5 个长度单位</h2>
  <div class="card">
    <p>点一个单位，看看它大约有多长。</p>
    <button type="button" class="urow" data-ref="毫米"><b>1 毫米（mm）</b><span>一张银行卡的厚度；尺子上 1 小格</span></button>
    <button type="button" class="urow" data-ref="厘米"><b>1 厘米（cm）</b><span>手指甲的宽度</span></button>
    <button type="button" class="urow" data-ref="分米"><b>1 分米（dm）</b><span>手掌的宽度；1 分米 = 10 厘米</span></button>
    <button type="button" class="urow" data-ref="米"><b>1 米（m）</b><span>张开双臂大约 1 米；教室门宽约 1 米</span></button>
    <button type="button" class="urow" data-ref="千米"><b>1 千米（km）</b><span>学校 400 米跑道跑 2 圈半；1 千米也叫 1 公里</span></button>
    <p id="refOut" class="say" hidden></p>
    <p><b>尺子上的小格</b>（单位：厘米）。点其中 1 厘米。</p>
    <div class="ruler" id="ruler"><div class="zero">0</div></div>
    <p id="rulerOut">点金色尺子上的一段。</p>
  </div>
  <h2 class="sec">二、换算阶梯</h2>
  <div class="card">
    <p>从大到小：千米、米、分米、厘米、毫米。点中间的进率。</p>
    <div class="ladder" id="ladder"></div>
    <p id="rateOut">点「×多少」看这一级怎么换。</p>
    <div class="say"><b>口诀：</b>大单位换小单位，乘进率；小单位换大单位，除以进率。<br>1 米 = 10 分米 = 100 厘米 = 1000 毫米；1 千米 = 1000 米；1 分米 = 10 厘米；1 厘米 = 10 毫米。</div>
  </div>
  <h2 class="sec">三、分米条，一根一根点出来</h2>
  <div class="card">
    <p>1 根分米条 = 1 分米 = 10 厘米。</p>
    <button type="button" class="stepbtn" id="barBtn">再出现 1 根分米条</button>
    <p class="sumline" id="barSum">0 分米 = 0 厘米</p>
    <div id="mile"></div>
    <div class="bars" id="bars"></div>
    <p>50 分米 = 50 个 10 厘米 = 500 厘米。反过来：300 厘米里有 30 个 10 厘米，所以 300 厘米 = 30 分米。</p>
    <button type="button" class="stepbtn" id="revBtn">反过来数：300 里再添一个 10</button>
    <p class="sumline" id="revOut">还没开始数。300 ÷ 10 = ？</p>
  </div>
  <h2 class="sec">四、小心这些坑</h2>
  <div class="card">
    <p><b>1.</b> 妈妈身高「1 米 6 分米」，不是 1 米 6 厘米。1 米 6 分米 = 16 分米 = 160 厘米。</p>
    <div class="pitrow">
      <button type="button" class="pitbtn" data-pit="1" data-k="cm">如果读成 1 米 6 厘米</button>
      <button type="button" class="pitbtn" data-pit="1" data-k="dm">读成 1 米 6 分米</button>
    </div>
    <p id="pit1"></p>
    <p><b>2.</b> 2 米 − 8 分米，先把 2 米换成 20 分米。</p>
    <button type="button" class="pitbtn" id="pit2">一步一步算 2 米 − 8 分米</button>
    <p id="pit2out"></p>
    <p><b>3.</b> 等号两边单位要一致：400 × 5 = 2000（米），2000 米 = 2 千米。</p>
    <button type="button" class="pitbtn" id="pit3">先写米，再换千米</button>
    <p id="pit3out"></p>
    <p><b>4.</b> 用尺子量，要从 0 刻度量起。不从 0 开始，就用右端读数减左端读数。</p>
    <button type="button" class="pitbtn" id="pit4">例如左端 2 厘米、右端 7 厘米</button>
    <p id="pit4out"></p>
  </div>
</template>
<script src="../common/report.js"></script>
<script src="../common/play.js"></script>
<script src="questions.js"></script>
<script>
function bindDanweiHome(api) {
  function raw() { return api.raw(); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  $all('.urow').forEach(function (b) {
    b.onclick = function () {
      $all('.urow').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      var out = document.getElementById('refOut');
      out.hidden = false;
      out.textContent = '记住了：' + b.querySelector('b').textContent + '。' + b.querySelector('span').textContent + '。';
    };
  });
  var ruler = document.getElementById('ruler');
  for (var c = 1; c <= 5; c++) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cm';
    btn.innerHTML = '<span class="ticks"></span><span class="mid"></span><i>' + c + '</i>';
    btn.onclick = function () {
      $all('.cm', ruler).forEach(function (x) { x.classList.remove('on'); });
      this.classList.add('on');
      document.getElementById('rulerOut').textContent = '这 1 厘米 = 10 个小格 = 10 毫米。每 1 小格 = 1 毫米。';
    };
    ruler.appendChild(btn);
  }
  var rates = [
    { a: '千米', b: '米', t: 1000 },
    { a: '米', b: '分米', t: 10 },
    { a: '分米', b: '厘米', t: 10 },
    { a: '厘米', b: '毫米', t: 10 }
  ];
  var ladder = document.getElementById('ladder');
  var unitText = {
    '毫米': '1 毫米大约是银行卡的厚度，也是尺子上 1 小格。',
    '厘米': '1 厘米大约是手指甲的宽度。1 厘米 = 10 毫米。',
    '分米': '1 分米大约是手掌的宽度。1 分米 = 10 厘米。',
    '米': '张开双臂大约 1 米。1 米 = 10 分米 = 100 厘米 = 1000 毫米。',
    '千米': '1 千米 = 1000 米，也叫 1 公里。400 米跑道跑 2 圈半大约是 1 千米。'
  };
  rates.forEach(function (r, idx) {
    if (idx === 0) {
      var top = document.createElement('button');
      top.type = 'button';
      top.className = 'unitpill';
      top.textContent = r.a;
      top.onclick = function () { document.getElementById('rateOut').textContent = unitText[r.a]; };
      ladder.appendChild(top);
    }
    var rate = document.createElement('button');
    rate.type = 'button';
    rate.className = 'rate';
    rate.textContent = r.a + ' ×' + r.t + ' ↓ ' + r.b;
    rate.onclick = function () {
      $all('.rate').forEach(function (x) { x.classList.remove('on'); });
      rate.classList.add('on');
      document.getElementById('rateOut').textContent = '1 ' + r.a + ' = ' + r.t + ' ' + r.b + '。大单位换成小单位乘 ' + r.t + '，反过来除以 ' + r.t + '。';
    };
    ladder.appendChild(rate);
    var pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'unitpill';
    pill.textContent = r.b;
    pill.onclick = function () { document.getElementById('rateOut').textContent = unitText[r.b]; };
    ladder.appendChild(pill);
  });
  function renderBars(n) {
    var box = document.getElementById('bars');
    var html = '';
    for (var i = 1; i <= 50; i++) {
      html += '<button type="button" class="bar' + (i <= n ? ' on' : '') + '" data-i="' + i + '">' + (i <= n ? '10厘米' : i) + '</button>';
    }
    box.innerHTML = html;
    document.getElementById('barSum').textContent = n === 0 ? '0 分米 = 0 厘米' : (n + ' 分米 = ' + n + ' 个 10 厘米 = ' + (n * 10) + ' 厘米');
    var msg = '';
    if (n >= 5) msg += '<div class="mile">5 条 = 5 分米 = 50 厘米</div>';
    if (n >= 10) msg += '<div class="mile">10 分米 = 1 米 = 100 厘米</div>';
    if (n >= 50) msg += '<div class="mile">50 分米 = 500 厘米。5 米也是 500 厘米。</div>';
    document.getElementById('mile').innerHTML = msg;
    var barBtn = document.getElementById('barBtn');
    barBtn.disabled = n >= 50;
    barBtn.textContent = n >= 50 ? '50 根都到齐了' : '再出现 1 根分米条';
    $all('.bar', box).forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-i');
        if (i === raw().bars + 1) addBar();
      };
    });
  }
  function addBar() {
    var p = raw();
    if (p.bars >= 50) return;
    p.bars += 1;
    api.save();
    renderBars(p.bars);
  }
  function renderRev(n) {
    var el = document.getElementById('revOut');
    var revBtn = document.getElementById('revBtn');
    if (n <= 0) el.textContent = '还没开始数。300 ÷ 10 = ？';
    else el.textContent = n + ' 个 10 厘米 = ' + (n * 10) + ' 厘米 = ' + n + ' 分米';
    revBtn.disabled = n >= 30;
    if (n >= 30) el.textContent = '30 个 10 = 300，所以 300 厘米 = 30 分米';
  }
  document.getElementById('barBtn').onclick = addBar;
  renderBars(raw().bars || 0);
  document.getElementById('revBtn').onclick = function () {
    var p = raw();
    if (p.rev >= 30) return;
    p.rev += 1;
    api.save();
    renderRev(p.rev);
  };
  renderRev(raw().rev || 0);
  $all('[data-pit="1"]').forEach(function (b) {
    b.onclick = function () {
      var out = document.getElementById('pit1');
      if (b.getAttribute('data-k') === 'cm') out.textContent = '1 米 6 厘米 = 106 厘米，少了很多。身高不是这样读的。';
      else out.textContent = '1 米 = 10 分米，10 + 6 = 16 分米 = 160 厘米。';
    };
  });
  var p2 = 0, p3 = 0;
  document.getElementById('pit2').onclick = function () {
    p2 = Math.min(2, p2 + 1);
    document.getElementById('pit2out').textContent = ['先统一单位：2 米 = 20 分米。', '20 − 8 = 12 分米。'].slice(0, p2).join('');
  };
  document.getElementById('pit3').onclick = function () {
    p3 = Math.min(2, p3 + 1);
    document.getElementById('pit3out').textContent = ['400 × 5 = 2000（米）。', '2000 米 = 2 千米。等号两边要先写成同一个单位。'].slice(0, p3).join('');
  };
  document.getElementById('pit4').onclick = function () {
    document.getElementById('pit4out').textContent = '不从 0 开始：7 − 2 = 5（厘米）。右端读数减左端读数。';
  };
}
KejianPlay.start({
  key: 'danwei-lianxi-v1',
  shape: 'bucket',
  title: '长度单位换算',
  report: { id: 'danwei-lianxi', name: '长度单位换算', questions: window.DANWEI_REPORT },
  home: {
    h1: '📐 长度单位换算',
    sub: '毫米、厘米、分米、米、千米',
    points: [
      { n: '1', t: '它有多长？', d: '先在心里比一比，再选单位' },
      { n: '2', t: '进率是多少？', d: '下楼乘，上楼除' },
      { n: '3', t: '单位一样吗？', d: '比大小、做应用题之前先换算' }
    ]
  },
  levels: window.DANWEI_LEVELS,
  homeHTML: document.getElementById('homeExtra').innerHTML,
  bindHome: bindDanweiHome
});
</script>
<p class="catline" style="margin:18px 12px 28px;padding:14px 16px;background:#fffdf8;border-radius:16px;box-shadow:0 3px 0 #f1c26b;font-size:20px;line-height:1.6">本页练习：<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E9%95%BF%E5%BA%A6%E5%8D%95%E4%BD%8D%E4%B8%8E%E6%8D%A2%E7%AE%97">长度单位与换算</a>、<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E7%9C%8B%E5%9B%BE%E5%88%97%E5%BC%8F%E4%B8%8E%E6%95%B0%E9%87%8F%E5%85%B3%E7%B3%BB">看图列式与数量关系</a></p>
</body>
</html>
