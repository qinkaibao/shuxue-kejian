<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8e7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%95%3C/text%3E%3C/svg%3E">
<title>错题记录</title>
<style>
  :root {
    --paper: #fff8e7;
    --card: #fffdf8;
    --ink: #382817;
    --muted: #74572f;
    --orange: #c2410c;
    --gold: #f1c26b;
    --green: #287a3d;
    --focus: #1d5fd0;
    --bar-h: 118px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 20px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 8% -5%, #fff1b8 0, rgba(255, 241, 184, 0) 38%),
      radial-gradient(circle at 100% 12%, #ffe3bd 0, rgba(255, 227, 189, 0) 28%),
      var(--paper);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    font-size: 22px;
    line-height: 1.55;
    padding-top: var(--bar-h);
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    background: rgba(255, 248, 231, .97);
    box-shadow: 0 2px 0 var(--gold);
  }
  .topbar-inner {
    max-width: 920px; margin: 0 auto;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .hbtn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 6px 12px;
    border: 2px solid #e0a800; border-radius: 14px;
    background: #ffd166; color: #5a3d00; font-size: 18px; font-weight: bold;
    text-decoration: none; box-shadow: 0 3px 0 #e0a800;
  }
  .hbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0a800; }
  .hbtn.go { background: #fb8500; color: #fff; border-color: #c96a00; box-shadow: 0 3px 0 #c96a00; }
  .bar-title { margin: 0; font-size: 28px; color: var(--orange); line-height: 1.2; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 12px 12px 48px; }
  .lead { margin: 4px 0 14px; color: var(--muted); font-size: 20px; }
  .cat {
    scroll-margin-top: calc(var(--bar-h) + 8px);
    margin: 0 0 12px;
  }
  .cat-card {
    width: 100%; text-align: left;
    background: var(--card); border: none; border-radius: 20px;
    box-shadow: 0 4px 0 var(--gold);
    padding: 14px 16px; color: var(--ink);
  }
  .cat.open .cat-card { box-shadow: 0 4px 0 #e8590c; }
  .cat-name { display: block; font-size: 26px; font-weight: bold; color: var(--orange); line-height: 1.3; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .pill {
    background: #fff3bf; border-radius: 12px; padding: 4px 10px;
    font-size: 18px; font-weight: bold; color: #7a4b00;
  }
  .judge { border-radius: 12px; padding: 4px 10px; font-size: 18px; font-weight: bold; }
  .judge.start { background: #eee; color: #666; }
  .judge.again { background: #fff4e0; color: #9a4b00; }
  .judge.done { background: #dcfce7; color: #14692c; }
  .cat-body {
    background: #fff; border-radius: 18px; margin-top: 8px; padding: 8px 12px 14px;
    box-shadow: 0 3px 12px rgba(200, 140, 0, .12);
  }
  .item { padding: 12px 0; border-bottom: 1px dashed #f0d9a8; }
  .item:last-child { border-bottom: none; }
  .item h3 { margin: 0 0 6px; font-size: 20px; color: #8a6d3b; }
  .q { margin: 0 0 8px; font-size: 22px; }
  details { background: #fff8e7; border-radius: 12px; margin: 6px 0; padding: 4px 12px; }
  summary { cursor: pointer; font-weight: bold; min-height: 44px; line-height: 44px; color: var(--orange); }
  .src { margin: 6px 0 0; color: var(--muted); font-size: 18px; }
  .empty { color: var(--muted); }
  @media (max-width: 700px) {
    .bar-title { font-size: 24px; }
    .cat-name { font-size: 24px; }
    .q { font-size: 22px; }
  }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="row">
      <a class="hbtn" href="../index.html">🏠 回总目录</a>
      <a class="hbtn go" href="../cuoti-lianxi/">去做练习</a>
      <p class="bar-title">错题记录</p>
    </div>
  </div>
</header>
<main class="wrap">
  <p class="lead" id="lead">这一页只看原始错题。要再做一次，点上面的「去做练习」。</p>
  <div id="cats"></div>
</main>
<script>
(function () {
  var FENLEI = [];
  var DATA = [];
  var openName = '';

  var PRACTICE = [
    {
      reportId: 'lianxi',
      progressKey: 'lianxi_kejian_v1',
      groups: [
        ['看图列式与数量关系', ids(1, 7)],
        ['同级混合运算', ids(8, 11)],
        ['两级混合运算', ids(12, 15)],
        ['括号与运算顺序', ids(16, 17)],
        ['口算数位与进退位', ids(18, 21)],
        ['长度单位与换算', ids(22, 31)]
      ]
    },
    {
      reportId: 'danwei-lianxi',
      progressKey: 'danwei-lianxi-v1',
      groups: [
        ['长度单位与换算', ids(1, 25)],
        ['看图列式与数量关系', ['26']]
      ]
    },
    {
      reportId: 'changdu',
      progressKey: 'changdu-hedeng-v1',
      groups: [[
        '长度单位与换算',
        ['ruler', 'units', 'lens', 'rope', 'trackQ', 'lamps', 'momUnit', 'momCm', 'sortFill', 'sortOrder']
      ]]
    },
    {
      reportId: 'changdu-zhuanti',
      progressKey: 'changdu-zhuanti-progress-v1',
      groups: [['长度单位与换算', ids(1, 27).map(function (n) { return 'q' + n; })]]
    },
    {
      reportId: 'tiehuan',
      progressKey: 'tiehuan-v1',
      groups: [['长度单位与换算', ids(1, 6)]]
    },
    {
      reportId: 'heji',
      progressKey: 'heji-v1',
      groups: [
        ['长度单位与换算', ['1', '2', '3', '4', '5', '6', '12', '13', '14']],
        ['间隔与往返', ['7', '8', '9', '10', '11', '17', '18', '19']],
        ['有余数除法', ['15', '16']]
      ]
    },
    {
      reportId: 'chuangguan',
      progressKey: 'math_shenti_v1',
      groups: [[
        '看图列式与数量关系',
        ['1-1', '1-2', '1-3', '2-1', '2-2', '2-3', '3-1', '3-2', '3-3', '4-1', '4-2', '4-3', '5-1', '5-2', '5-3']
      ]]
    }
  ];

  function ids(a, b) {
    var out = [];
    for (var i = a; i <= b; i++) out.push(String(i));
    return out;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function readJSON(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function dayNum(text) {
    var p = String(text || '').split('-');
    if (p.length !== 3) return null;
    var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
    if (!y || !m || !d) return null;
    return Date.UTC(y, m - 1, d) / 86400000;
  }

  function touchedSet(raw) {
    var idsFound = {};
    function walk(o, depth) {
      if (!o || typeof o !== 'object' || depth > 4) return;
      Object.keys(o).forEach(function (k) {
        var v = o[k];
        if (v && typeof v === 'object') {
          if (v.correct || v.stars || v.solved) idsFound[k] = 1;
          walk(v, depth + 1);
        } else if (v) {
          idsFound[k] = 1;
        }
      });
    }
    walk(raw, 0);
    return idsFound;
  }

  function reportOf(id) {
    var raw = readJSON('kejian-report-v1:' + id);
    if (!raw || typeof raw !== 'object') return null;
    return {
      misses: raw.misses || {},
      firstWrong: raw.firstWrong || {},
      solved: raw.solved || {},
      legacy: raw.legacy || {},
      history: Array.isArray(raw.history) ? raw.history : []
    };
  }

  function snapshot(report, idList) {
    var once = 0, correct = 0, touched = false;
    if (!report) return { once: 0, correct: 0, touched: false };
    idList.forEach(function (id) {
      var solved = !!report.solved[id];
      var legacy = !!report.legacy[id];
      var misses = Number(report.misses[id] || 0);
      var wrong = report.firstWrong[id];
      if (solved || legacy || misses || wrong) touched = true;
      if (solved) {
        correct++;
        if (!misses && !wrong) once++;
      } else if (legacy && !misses && !wrong) {
        correct++;
      }
    });
    return { once: once, correct: correct, touched: touched };
  }

  function progressHit(key, idList) {
    var raw = readJSON(key);
    if (!raw) return false;
    var found = touchedSet(raw);
    for (var i = 0; i < idList.length; i++) {
      if (found[idList[i]]) return true;
    }
    return false;
  }

  function evalCategory(name) {
    var attempts = [];
    var practiced = false;
    var liveOnce = 0;
    var liveCorrect = 0;
    var liveTouched = false;

    function takeSnap(report, idList) {
      var snap = snapshot(report, idList);
      if (!snap.touched) return;
      practiced = true;
      liveTouched = true;
      liveOnce += snap.once;
      liveCorrect += snap.correct;
    }

    PRACTICE.forEach(function (page) {
      var idList = [];
      page.groups.forEach(function (g) { if (g[0] === name) idList = idList.concat(g[1]); });
      if (!idList.length) return;
      var report = reportOf(page.reportId);
      if (report) {
        report.history.forEach(function (h, i) {
          var bucket = h && h.byCategory && h.byCategory[name];
          if (!bucket || typeof bucket.onceRate !== 'number') return;
          attempts.push({ date: h.date || '', onceRate: bucket.onceRate, order: i });
        });
        takeSnap(report, idList);
      }
      if (progressHit(page.progressKey, idList)) practiced = true;
    });

    var cuotiIds = DATA.filter(function (q) { return q.category === name; }).map(function (q) { return q.id; });
    var cuoti = reportOf('cuoti');
    if (cuoti) {
      cuoti.history.forEach(function (h, i) {
        var bucket = h && h.byCategory && h.byCategory[name];
        if (!bucket || typeof bucket.onceRate !== 'number') return;
        attempts.push({ date: h.date || '', onceRate: bucket.onceRate, order: 1000 + i });
      });
      takeSnap(cuoti, cuotiIds);
    }
    if (progressHit('cuoti-book-v1', cuotiIds)) practiced = true;
    var live = liveTouched ? (liveCorrect ? Math.round(liveOnce / liveCorrect * 100) : 0) : null;

    attempts.sort(function (a, b) {
      if (a.date === b.date) return a.order - b.order;
      if (!a.date) return -1;
      if (!b.date) return 1;
      return a.date < b.date ? -1 : 1;
    });

    var judge = '刚开始练';
    if (attempts.length >= 2) {
      var prev = attempts[attempts.length - 2];
      var last = attempts[attempts.length - 1];
      var da = dayNum(prev.date);
      var db = dayNum(last.date);
      var gap = da != null && db != null ? db - da : 0;
      judge = prev.onceRate >= 80 && last.onceRate >= 80 && gap >= 7 ? '已掌握' : '还要练';
    } else if (attempts.length || practiced) {
      judge = '还要练';
    }

    var rate = null;
    if (attempts.length) rate = attempts[attempts.length - 1].onceRate;
    else if (live != null) rate = live;

    return { judge: judge, rate: rate };
  }

  function judgeClass(label) {
    if (label === '已掌握') return 'done';
    if (label === '还要练') return 'again';
    return 'start';
  }

  function sortItems(list) {
    return list.slice().sort(function (a, b) {
      if (!a.date && b.date) return 1;
      if (a.date && !b.date) return -1;
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.no - b.no;
    });
  }

  function itemsHTML(name) {
    var list = sortItems(DATA.filter(function (q) { return q.category === name; }));
    if (!list.length) return '<p class="empty">这一类还没有原始错题。</p>';
    return list.map(function (q) {
      var where = [q.lesson, q.pos].filter(Boolean).join(' · ');
      return ''
        + '<article class="item">'
        + '<h3>第' + q.no + '题' + (q.date ? ' · ' + esc(q.date) : '') + '</h3>'
        + '<p class="q">' + esc(q.question) + '</p>'
        + '<details><summary>当时错答</summary><p>' + esc(q.wrong || '（空）') + '</p></details>'
        + '<details><summary>正确答案和讲解</summary><p><b>' + esc(q.answer) + '</b></p><p>' + esc(q.explain) + '</p></details>'
        + '<p class="src">出处：' + esc(where || '未记') + '</p>'
        + '</article>';
    }).join('');
  }

  function render() {
    var html = FENLEI.map(function (row) {
      var stat = evalCategory(row.分类);
      var sets = (row.pages || []).length;
      var total = row.相关练习题数合计 || 0;
      var rateText = stat.rate == null ? '—' : (stat.rate + '%');
      var opened = openName === row.分类;
      return ''
        + '<section class="cat' + (opened ? ' open' : '') + '" id="cat-' + esc(row.分类) + '">'
        + '<button type="button" class="cat-card" data-cat="' + esc(row.分类) + '" aria-expanded="' + (opened ? 'true' : 'false') + '">'
        + '<span class="cat-name">' + esc(row.分类) + '</span>'
        + '<span class="meta">'
        + '<span class="pill">错题 ' + row.错题数 + '</span>'
        + '<span class="pill">' + sets + ' 份练习，共 ' + total + ' 题</span>'
        + '<span class="pill">最近一次就对率 ' + rateText + '</span>'
        + '<span class="judge ' + judgeClass(stat.judge) + '">' + stat.judge + '</span>'
        + '</span></button>'
        + (opened ? '<div class="cat-body">' + itemsHTML(row.分类) + '</div>' : '')
        + '</section>';
    }).join('');
    document.getElementById('cats').innerHTML = html;
  }

  function syncBar() {
    var bar = document.getElementById('topbar');
    if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  }

  function hashName() {
    var h = '';
    try { h = decodeURIComponent(location.hash || ''); } catch (e) { h = location.hash || ''; }
    if (h.charAt(0) === '#') h = h.slice(1);
    if (h.indexOf('cat-') !== 0) return '';
    return h.slice(4);
  }

  function openFromHash(scroll) {
    var name = hashName();
    if (!name) return;
    if (!FENLEI.some(function (row) { return row.分类 === name; })) return;
    openName = name;
    render();
    if (!scroll) return;
    var el = document.getElementById('cat-' + name);
    if (el) {
      try { el.scrollIntoView({ block: 'start' }); } catch (e) { el.scrollIntoView(); }
    }
  }

  document.getElementById('cats').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-cat]');
    if (!btn) return;
    var name = btn.getAttribute('data-cat');
    if (openName === name) {
      openName = '';
      history.replaceState(null, '', location.pathname + location.search);
      render();
      return;
    }
    openName = name;
    var next = '#cat-' + encodeURIComponent(name);
    if (location.hash !== next) location.hash = next;
    else {
      render();
      openFromHash(true);
    }
  });

  window.addEventListener('hashchange', function () { openFromHash(true); });
  window.addEventListener('resize', syncBar);

  Promise.all([
    fetch('fenlei.json').then(function (r) { if (!r.ok) throw new Error('fenlei'); return r.json(); }),
    fetch('data.json').then(function (r) { if (!r.ok) throw new Error('data'); return r.json(); })
  ]).then(function (pair) {
    FENLEI = pair[0] || [];
    DATA = (pair[1] && pair[1].items) || [];
    syncBar();
    if (hashName()) openFromHash(true);
    else render();
  }).catch(function () {
    document.getElementById('lead').textContent = '分类没有读出来。请从网站目录重新打开这一页。';
  });
  syncBar();
})();
</script>
</body>
</html>
