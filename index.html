<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8e7">
<title>数学课件总目录</title>
<style>
  :root {
    --paper: #fff8e7;
    --card: #fffdf8;
    --ink: #382817;
    --muted: #74572f;
    --orange: #c2410c;
    --orange-deep: #9a3412;
    --gold: #f1c26b;
    --gold-deep: #d99a18;
    --green: #287a3d;
    --focus: #1d5fd0;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    font-size: 20px;
    scroll-behavior: smooth;
    scroll-padding-top: calc(var(--home-bar-h, 48px) + 8px);
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(circle at 8% -5%, #fff1b8 0, rgba(255, 241, 184, 0) 38%),
      radial-gradient(circle at 100% 18%, #ffe3bd 0, rgba(255, 227, 189, 0) 30%),
      var(--paper);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    font-size: 22px;
    line-height: 1.55;
  }

  button,
  a {
    font-family: inherit;
  }

  a {
    color: inherit;
  }

  #app {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: calc(var(--home-bar-h, 48px) + 8px) 14px 44px;
  }

  .hero {
    padding: 12px 2px 2px;
    text-align: center;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    margin: 0 0 4px;
    padding: 2px 14px;
    border: 2px solid #f3cf88;
    border-radius: 999px;
    background: rgba(255, 253, 248, .7);
    color: #8a5a09;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.25;
  }

  h1 {
    margin: 4px 0 6px;
    color: var(--orange);
    font-size: clamp(34px, 9vw, 46px);
    line-height: 1.18;
    letter-spacing: 1px;
    text-wrap: balance;
  }

  .sub {
    margin: 0 auto;
    max-width: 32em;
    color: var(--muted);
    font-size: 21px;
    line-height: 1.5;
    text-wrap: balance;
  }

  .guide {
    width: min(100%, 760px);
    margin: 18px auto 0;
    padding: 18px 16px 16px;
    border: 3px solid #f1c26b;
    border-radius: 26px;
    background: linear-gradient(180deg, #fffdf8 0%, #fff4d8 100%);
    box-shadow: 0 8px 0 #efc77a, 0 16px 34px rgba(163, 106, 0, .12);
    text-align: center;
  }

  .guide-lead {
    margin: 0 0 14px;
    color: #8a3a06;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.4;
    text-wrap: balance;
  }

  .home-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    margin: 0;
    padding: calc(6px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
    background: #fff8e7;
    box-shadow: 0 2px 0 #f1c26b;
  }

  .guide-btn {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 34px;
    padding: 0 10px;
    border: 2px solid rgba(255, 255, 255, .6);
    border-radius: 12px;
    color: #4a2c00;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 2px 0 #e0a800;
    touch-action: manipulation;
  }

  .sum-line {
    flex: 0 0 auto;
    margin: 0 0 0 auto;
    color: #6b4708;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
    white-space: nowrap;
  }

  .guide-story {
    background: linear-gradient(135deg, #ffe08a, #ffc247);
  }

  .guide-practice {
    background: linear-gradient(135deg, #ffd8a8, #ffb35c);
    box-shadow: 0 2px 0 #d97b00;
  }

  .guide-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #e0a800;
  }

  .guide-practice:active {
    box-shadow: 0 0 0 #d97b00;
  }

  .guide-btn:focus-visible,
  .card:focus-visible {
    outline: 4px solid var(--focus);
    outline-offset: 4px;
  }

  .guide-progress {
    margin: 16px 0 0;
    padding-top: 13px;
    border-top: 2px dashed #eac98a;
    color: #6b4708;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.5;
    text-wrap: balance;
  }

  .guide-progress .nowrap {
    white-space: nowrap;
  }

  .catalog {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 24px;
    margin-top: 22px;
  }

  .section {
    min-width: 0;
    scroll-margin-top: calc(var(--home-bar-h, 48px) + 12px);
  }

  #stories,
  #practice {
    scroll-margin-top: calc(var(--home-bar-h, 48px) + 12px);
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 2px 12px;
  }

  .section-head h2 {
    margin: 0;
    color: var(--orange-deep);
    font-size: 29px;
    line-height: 1.25;
    letter-spacing: .5px;
  }

  .section-head .count {
    flex: 0 0 auto;
    min-height: 32px;
    padding: 2px 11px;
    border-radius: 999px;
    background: #fff0c2;
    color: #7a5200;
    font-size: 20px;
    font-weight: 700;
    line-height: 28px;
  }

  .deck {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .card {
    display: block;
    overflow: hidden;
    border: 2px solid #f4dfb3;
    border-radius: 24px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 6px 0 #efc77a, 0 12px 28px rgba(163, 106, 0, .10);
    touch-action: manipulation;
    transition: transform .16s ease, box-shadow .16s ease;
  }

  .card:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #efc77a, 0 6px 16px rgba(163, 106, 0, .10);
  }

  .cover {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    min-height: 116px;
    padding: 14px 16px 12px;
    overflow: hidden;
    isolation: isolate;
  }

  .cover::before,
  .cover::after {
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    background: rgba(255, 255, 255, .26);
    content: "";
  }

  .cover::before {
    top: -44px;
    right: -28px;
    width: 142px;
    height: 142px;
  }

  .cover::after {
    bottom: -50px;
    left: 26%;
    width: 108px;
    height: 108px;
    background: rgba(255, 255, 255, .16);
  }

  .tone-a { background: linear-gradient(135deg, #ffd166, #fb8500); }
  .tone-b { background: linear-gradient(135deg, #b2f2bb, #2fa36b); }
  .tone-c { background: linear-gradient(135deg, #a5d8ff, #3b82f6); }
  .tone-d { background: linear-gradient(135deg, #ffc9c9, #e8590c); }
  .tone-e { background: linear-gradient(135deg, #d0bfff, #7048e8); }

  .cover-emoji {
    font-size: 62px;
    line-height: 1;
    filter: drop-shadow(0 3px 0 rgba(60, 30, 0, .13));
    transform: translateY(2px);
  }

  .cover-kind {
    align-self: flex-start;
    min-height: 34px;
    margin-left: auto;
    padding: 2px 12px;
    border: 1px solid rgba(255, 255, 255, .6);
    border-radius: 999px;
    background: rgba(255, 253, 248, .84);
    color: #6b3f05;
    font-size: 20px;
    font-weight: 800;
    line-height: 28px;
  }

  .badge-new {
    position: absolute;
    top: 12px;
    left: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 48px;
    min-height: 38px;
    padding: 2px 12px;
    border: 2px solid #fff;
    border-radius: 999px;
    background: #d9480f;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
    box-shadow: 0 3px 0 rgba(120, 37, 0, .24);
  }

  .card-body {
    padding: 15px 17px 17px;
  }

  .card h3 {
    margin: 0;
    color: var(--orange);
    font-size: 26px;
    line-height: 1.3;
    letter-spacing: .3px;
  }

  .date {
    display: block;
    margin: 3px 0 0;
    color: #9a6200;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
  }

  .desc {
    margin: 8px 0 0;
    color: #56452f;
    font-size: 21px;
    line-height: 1.52;
  }

  .progress {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 2px dashed #f1d9a7;
  }

  .progress-label {
    display: block;
    margin-bottom: 7px;
    color: #68490f;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
  }

  .progress-empty .progress-label {
    color: #8a7350;
  }

  .track {
    height: 14px;
    overflow: hidden;
    border-radius: 999px;
    background: #f3e4c5;
    box-shadow: inset 0 1px 2px rgba(107, 71, 8, .12);
  }

  .fill {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #f59f00, #fb8500);
    transition: width .35s ease;
  }

  .foot {
    margin: 30px 4px 0;
    color: #795b2d;
    font-size: 20px;
    line-height: 1.55;
    text-align: center;
  }

  @media (max-width: 700px) {
    .guide-btn { min-height: 32px; padding: 0 8px; font-size: 15px; }
    .sum-line { font-size: 13px; }
  }

  @media (max-width: 370px) {
    #app { padding-inline: 10px; }
    .guide { padding-inline: 12px; }
    .card h3 { font-size: 24px; }
  }

  @media (min-width: 760px) {
    #app {
      padding: calc(var(--home-bar-h, 48px) + 8px) 22px 56px;
    }

    .hero {
      padding-top: 8px;
    }

    .catalog {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
      margin-top: 26px;
    }

    .section-head h2 {
      font-size: 31px;
    }

    .cover {
      min-height: 134px;
    }

    .cover-emoji {
      font-size: 68px;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #efc77a, 0 16px 30px rgba(163, 106, 0, .13);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card, .fill { transition: none; }
  }
</style>
</head>
<body>
<nav class="home-bar" aria-label="快速开始">
  <a class="guide-btn guide-story" href="#stories">📖 读故事</a>
  <a class="guide-btn guide-practice" href="#practice">✏️ 做练习</a>
  <p class="sum-line" id="sumLine">练习星还没点亮</p>
</nav>
<div id="app">
  <header class="hero">
    <p class="kicker"><span aria-hidden="true">🌞</span> 三年级 · 数学小书房</p>
    <h1>数学课件总目录</h1>
    <p class="sub">新的排在前面。点一张封面就进去。</p>
  </header>

  <section class="guide" aria-labelledby="guideLead">
    <p class="guide-lead" id="guideLead">先读一个小故事，再去做练习吧！</p>
    <p class="guide-progress" id="guideProgress" aria-live="polite">正在读练习进度…</p>
  </section>

  <main class="catalog">
    <section class="section" id="stories" aria-labelledby="storiesTitle">
      <div class="section-head">
        <h2 id="storiesTitle">数学小故事</h2>
        <span class="count" id="storyCount">6 篇</span>
      </div>
      <div class="deck" id="storyDeck"></div>
    </section>

    <section class="section" id="practice" aria-labelledby="practiceTitle">
      <div class="section-head">
        <h2 id="practiceTitle">练习</h2>
        <span class="count" id="practiceCount">3 组</span>
      </div>
      <div class="deck" id="practiceDeck"></div>
    </section>
  </main>

  <p class="foot">练习页顶栏可以交作业。</p>
</div>

<script>
/*
  新增条目很简单：在下面的 ITEMS 数组里再加一个对象即可。
  type：'story' 是数学小故事，'practice' 是练习。
  id：本页内不重复的英文短名；title：卡片标题；date：'YYYY-MM-DD'。
  emoji：封面大图标；tone：配色，可选 'tone-a' 到 'tone-e'。
  desc：一句话介绍；path：相对网站根目录的链接，别忘了结尾的斜杠。
  total：这个练习一共有多少题（可选，有成绩单时用于算进度）。
  reportId：成绩单 id（可选）；有它就会读取 'kejian-report-v1:'+reportId。
  omitSummary：为 true 时不计入顶部练习汇总句。错题本用这个，卡片自己显示已掌握/总数。
  渲染时会自动按 date 从新到旧排序，最近 3 天内的条目自动加「新」徽章。
*/
const ITEMS = [
  {
    type: 'practice', id: 'cuoti', title: '错题本', date: '2026-10-18',
    emoji: '📕', tone: 'tone-d',
    desc: '142 道错题按分类收好，对照出处再做一次。',
    path: 'cuoti/', total: 142, reportId: 'cuoti', omitSummary: true
  },
  {
    type: 'practice', id: 'changdu-zhuanti', title: '长度换算专题', date: '2026-10-18',
    emoji: '📏', tone: 'tone-b',
    desc: '真正弄懂单位之间的换算',
    path: 'changdu-zhuanti/', total: 27, reportId: 'changdu-zhuanti'
  },
  {
    type: 'story', id: 'changdu', title: '竹尺巷的河灯', date: '2026-10-18',
    emoji: '🏮', tone: 'tone-a',
    desc: '把尺子的 0 对准，再把门高、翅膀和跑道换成对的单位。',
    path: 'changdu/', total: 10, reportId: 'changdu'
  },
  {
    type: 'practice', id: 'danwei-lianxi', title: '长度单位换算', date: '2026-10-18',
    emoji: '📐', tone: 'tone-c',
    desc: '先看进率，再做 26 道填单位、换算和比大小。',
    path: 'danwei-lianxi/', total: 26, reportId: 'danwei-lianxi'
  },
  {
    type: 'story', id: 'danwei', title: '失踪的单位牌', date: '2026-10-16',
    emoji: '📏', tone: 'tone-b',
    desc: '单位牌贴错路就走反，要把毫米到千米认回各自的钩子。',
    path: 'danwei/'
  },
  {
    type: 'practice', id: 'lianxi', title: '错题练习册', date: '2026-10-16',
    emoji: '📒', tone: 'tone-a',
    desc: '审题、运算顺序和长度换算，一共 31 道会判对错的题。',
    path: 'lianxi/', total: 31, reportId: 'lianxi'
  },
  {
    type: 'story', id: 'binggan', title: '失踪的饼干', date: '2026-10-14',
    emoji: '🍪', tone: 'tone-d',
    desc: '饼干数目对不上时，先看运算顺序，再判断有没有人偷吃。',
    path: 'binggan/'
  },
  {
    type: 'story', id: 'hongqi', title: '操场上的红旗', date: '2026-10-14',
    emoji: '🚩', tone: 'tone-d',
    desc: '分清 3 倍和多 3 面，还要看清问的是几队还是几人。',
    path: 'hongqi/'
  },
  {
    type: 'story', id: 'gushi', title: '雾海灯塔', date: '2026-10-12',
    emoji: '🌫️', tone: 'tone-e',
    desc: '大雾里看清问的是什么、单位是什么，才找得到回家的灯塔。',
    path: 'gushi/'
  },
  {
    type: 'story', id: 'duwu', title: '审题小侦探', date: '2026-10-12',
    emoji: '🔍', tone: 'tone-c',
    desc: '算式可以没错，问题和单位看错了，答案仍然会错。',
    path: 'duwu/'
  },
  {
    type: 'practice', id: 'chuangguan', title: '读题闯关', date: '2026-10-05',
    emoji: '🏆', tone: 'tone-b',
    desc: '每题走阅读理解、分析解答、回顾反思，算式收在右侧。',
    path: 'chuangguan/', total: 15, reportId: 'chuangguan'
  }
];

/* ---------- 读取与旧进度 ---------- */

function readJSON(key) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function countMap(obj, pred) {
  var done = 0, stars = 0;
  if (!obj) return { done: 0, stars: 0 };
  Object.keys(obj).forEach(function (k) {
    var v = pred(obj[k], k);
    if (v > 0) { done++; stars += v; }
  });
  return { done: done, stars: stars };
}

/* 原页保留的旧进度：只读，不改写。 */
function stats() {
  var cg = countMap(readJSON('math_shenti_v1'), function (v) {
    return typeof v === 'number' ? v : 0;
  });
  var lx = countMap(readJSON('lianxi_kejian_v1'), function (row) {
    if (!row || typeof row !== 'object') return 0;
    return row.stars || (row.correct ? 3 : 0);
  });
  var raw = readJSON('danwei-lianxi-v1') || {};
  var bag = {};
  Object.keys(raw.stars || {}).forEach(function (k) {
    if (raw.stars[k]) bag[k] = raw.stars[k];
  });
  Object.keys(raw.correct || {}).forEach(function (k) {
    if (raw.correct[k] && !bag[k]) bag[k] = 3;
  });
  var dw = countMap(bag, function (v) { return v; });
  var ztRaw = readJSON('changdu-zhuanti-progress-v1') || {};
  var ztBag = {};
  Object.keys(ztRaw.solved || {}).forEach(function (k) {
    if (ztRaw.solved[k]) ztBag[k] = 3;
  });
  var zt = countMap(ztBag, function (v) { return v; });
  var door = 0;
  var cd = readJSON('changdu-hedeng-v1');
  if (cd && cd.done) {
    Object.keys(cd.done).forEach(function (k) { if (cd.done[k]) door++; });
  }
  return { cg: cg, lx: lx, dw: dw, zt: zt, door: door };
}

/* ---------- 新成绩单进度 ---------- */

function asObject(value) {
  return value && typeof value === 'object' ? value : {};
}

function readReport(reportId) {
  if (!reportId) return null;
  var raw = readJSON('kejian-report-v1:' + reportId);
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  var data = {
    misses: asObject(raw.misses),
    firstWrong: asObject(raw.firstWrong),
    solved: asObject(raw.solved),
    legacy: asObject(raw.legacy)
  };
  var hasSomething = Object.keys(data.misses).length ||
    Object.keys(data.firstWrong).length ||
    Object.keys(data.solved).length ||
    Object.keys(data.legacy).length;
  return hasSomething ? data : null;
}

function reportProgress(item) {
  var data = readReport(item.reportId);
  if (!data) return null;

  var solved = data.solved;
  var legacy = data.legacy;
  var misses = data.misses;
  var firstWrong = data.firstWrong;
  var solvedKeys = Object.keys(solved).filter(function (k) { return !!solved[k]; });
  var solvedCount = solvedKeys.length;
  var legacyOnly = 0;

  Object.keys(legacy).forEach(function (k) {
    if (legacy[k] && !Object.prototype.hasOwnProperty.call(solved, k)) legacyOnly++;
  });

  var once = 0;
  solvedKeys.forEach(function (k) {
    var missCount = Number(misses[k] || 0);
    if (missCount === 0 && !firstWrong[k]) once++;
  });

  var correct = solvedCount + legacyOnly;
  var total = Number(item.total) > 0 ? Math.floor(Number(item.total)) : 0;
  var onceRate = correct ? Math.round(once / correct * 100) : 0; // 一次对率 = 一次就对的题 / 已做对的题
  var barPct = total ? Math.min(100, Math.round(correct / total * 100)) : 0;

  return {
    correct: correct,
    once: once,
    total: total,
    onceRate: onceRate,
    barPct: barPct
  };
}

/* 新成绩单还没写过时，继续把旧键里的进度显示在卡片上。 */
function legacyProgress(item) {
  var done = 0;
  var total = 0;
  var stars = 0;
  var label = '';
  var old;

  if (item.id === 'changdu') {
    old = stats();
    done = old.door;
    total = 6;
    if (!done) return null;
    label = '已过 ' + done + '/6 扇门';
  } else if (item.id === 'chuangguan') {
    old = stats();
    done = old.cg.done;
    stars = old.cg.stars;
    total = Number(item.total) || 15;
    if (!done && !stars) return null;
    label = '旧进度 ★ ' + stars + ' · 完成 ' + done + '/' + total;
  } else if (item.id === 'lianxi') {
    old = stats();
    done = old.lx.done;
    stars = old.lx.stars;
    total = Number(item.total) || 31;
    if (!done && !stars) return null;
    label = '旧进度 ★ ' + stars + ' · 完成 ' + done + '/' + total;
  } else if (item.id === 'danwei-lianxi') {
    old = stats();
    done = old.dw.done;
    stars = old.dw.stars;
    total = Number(item.total) || 26;
    if (!done && !stars) return null;
    label = '旧进度 ★ ' + stars + ' · 完成 ' + done + '/' + total;
  } else if (item.id === 'changdu-zhuanti') {
    old = stats();
    done = old.zt.done;
    stars = old.zt.stars;
    total = Number(item.total) || 27;
    if (!done && !stars) return null;
    label = '旧进度 ★ ' + stars + ' · 完成 ' + done + '/' + total;
  } else {
    return null;
  }

  return {
    correct: done,
    total: total,
    label: label,
    barPct: total ? Math.min(100, Math.round(done / total * 100)) : 0
  };
}

/* ---------- 渲染 ---------- */

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function localDayNumber(date) {
  return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000;
}

function isNew(dateText) {
  var parts = String(dateText || '').split('-');
  if (parts.length !== 3) return false;
  var itemDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(itemDate.getTime())) return false;
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var diff = localDayNumber(today) - localDayNumber(itemDate);
  return diff >= 0 && diff <= 3;
}

/* 错题本不走成绩单上的「已对 / 一次对率」，卡片只显示已掌握/总数。 */
function cuotiMastered(total) {
  var raw = readJSON('cuoti-book-v1');
  var status = raw && raw.status && typeof raw.status === 'object' ? raw.status : {};
  var n = 0;
  Object.keys(status).forEach(function (k) {
    if (status[k] === 'mastered') n++;
  });
  if (total && n > total) n = total;
  return n;
}

function progressHTML(item) {
  if (item.id === 'cuoti') {
    var cuotiTotal = Number(item.total) > 0 ? Math.floor(Number(item.total)) : 0;
    var mastered = cuotiMastered(cuotiTotal);
    var cuotiMax = cuotiTotal || Math.max(mastered, 1);
    var cuotiPct = cuotiTotal ? Math.min(100, Math.round(mastered / cuotiTotal * 100)) : 0;
    return ''
      + '<div class="progress">'
      +   '<span class="progress-label">已掌握 ' + mastered + '/' + cuotiTotal + '</span>'
      +   '<div class="track" role="progressbar" aria-label="错题本的进度" '
      +     'aria-valuemin="0" aria-valuemax="' + cuotiMax + '" aria-valuenow="' + Math.min(mastered, cuotiMax) + '">'
      +     '<span class="fill" style="width:' + cuotiPct + '%"></span>'
      +   '</div>'
      + '</div>';
  }

  var p = reportProgress(item);
  var label = '';
  var max = 0;
  var now = 0;
  var empty = false;

  if (p) {
    label = p.total
      ? ('已对 ' + p.correct + '/' + p.total + ' · 一次对率 ' + p.onceRate + '%')
      : ('已对 ' + p.correct + ' 题 · 一次对率 ' + p.onceRate + '%');
    max = p.total || Math.max(p.correct, 1);
    now = Math.min(p.correct, max);
  } else {
    p = legacyProgress(item);
    if (p) {
      label = p.label;
      max = p.total;
      now = Math.min(p.correct, max);
    } else {
      empty = true;
      label = item.type === 'story' ? '点开阅读' : '还没开始';
      max = Number(item.total) > 0 ? Number(item.total) : 0;
    }
  }

  return ''
    + '<div class="progress' + (empty ? ' progress-empty' : '') + '">'
    +   '<span class="progress-label">' + esc(label) + '</span>'
    +   '<div class="track" role="progressbar" aria-label="' + esc(item.title) + '的进度" '
    +     'aria-valuemin="0" aria-valuemax="' + max + '" aria-valuenow="' + now + '">'
    +     '<span class="fill" style="width:' + (p ? p.barPct : 0) + '%"></span>'
    +   '</div>'
    + '</div>';
}

function cardHTML(item) {
  var tone = /^tone-[a-e]$/.test(item.tone) ? item.tone : 'tone-a';
  var kind = item.type === 'story' ? '故事' : '练习';
  var aria = (item.type === 'story' ? '数学小故事：' : '练习：') + item.title;

  return ''
    + '<a class="card" href="' + esc(item.path) + '" aria-label="' + esc(aria) + '">'
    +   '<div class="cover ' + tone + '">'
    +     (isNew(item.date) ? '<span class="badge-new">新</span>' : '')
    +     '<span class="cover-emoji" aria-hidden="true">' + esc(item.emoji) + '</span>'
    +     '<span class="cover-kind">' + kind + '</span>'
    +   '</div>'
    +   '<div class="card-body">'
    +     '<h3>' + esc(item.title) + '</h3>'
    +     '<time class="date" datetime="' + esc(item.date) + '">' + esc(item.date) + '</time>'
    +     '<p class="desc">' + esc(item.desc) + '</p>'
    +     progressHTML(item)
    +   '</div>'
    + '</a>';
}

function sortedItems() {
  return ITEMS.slice().sort(function (a, b) {
    if (a.date === b.date) return 0;
    return a.date < b.date ? 1 : -1;
  });
}

function paintCards() {
  var items = sortedItems();
  var stories = items.filter(function (item) { return item.type === 'story'; });
  var practices = items.filter(function (item) { return item.type === 'practice'; });

  document.getElementById('storyDeck').innerHTML = stories.map(cardHTML).join('');
  document.getElementById('practiceDeck').innerHTML = practices.map(cardHTML).join('');
  document.getElementById('storyCount').textContent = stories.length + ' 篇';
  document.getElementById('practiceCount').textContent = practices.length + ' 组';
}

/* ---------- 顶部练习进度 ---------- */

function practiceState(item) {
  var p = reportProgress(item) || legacyProgress(item);
  if (!p) return null;
  var total = Number(p.total) > 0 ? Number(p.total) : 0;
  var correct = Number(p.correct) || 0;
  return {
    total: total,
    correct: correct,
    done: total > 0 && correct >= total
  };
}

function paintSummary() {
  var practices = ITEMS.filter(function (item) { return item.type === 'practice' && !item.omitSummary; });
  var started = 0;
  var done = 0;
  var partial = 0;

  practices.forEach(function (item) {
    var state = practiceState(item);
    if (!state) return;
    started++;
    if (state.done) done++;
    else partial++;
  });

  var el = document.getElementById('guideProgress');
  if (!el) return;

  if (!started) {
    el.innerHTML = '还没做过练习，<span class="nowrap">点上面“做练习”开始吧</span>';
    return;
  }

  var n = '<span class="nowrap">' + practices.length + ' 组</span>练习，';
  var line;
  if (done === 0) {
    line = n + '你做了 <span class="nowrap">' + partial + ' 组</span>的一部分，接着加油！';
  } else {
    line = n + '你做完了 <span class="nowrap">' + done + ' 组</span>';
    if (partial > 0) line += '，还有 <span class="nowrap">' + partial + ' 组</span>做了一部分';
    if (done === practices.length) line += '，全部完成啦！';
  }
  el.innerHTML = line;
}

/* 汇总句沿用 PR #14 之前根首页的规则，分母仍是 99 = 15 + 31 + 26 + 27。
   错题本不计入这句，也不计入「你做完了几组」。卡片自己读 cuoti-book-v1。
   长度换算专题读 changdu-zhuanti-progress-v1：solved 为真的题算完成，
   这一页不存星星，按旧规则「做对但没有星星」记 3 颗。河灯门数仍不计入。 */
function paintSumLine() {
  var s = stats();
  var stars = s.cg.stars + s.lx.stars + s.dw.stars + s.zt.stars;
  var done = s.cg.done + s.lx.done + s.dw.done + s.zt.done;
  var line = document.getElementById('sumLine');
  if (line) line.textContent = stars ? ('练习 ★ ' + stars + ' · 完成 ' + done + '/99') : '练习星还没点亮';
}

function syncHomeBar() {
  var bar = document.querySelector('.home-bar');
  if (!bar) return;
  document.documentElement.style.setProperty('--home-bar-h', bar.offsetHeight + 'px');
}

paintCards();
paintSummary();
paintSumLine();
syncHomeBar();
window.addEventListener('resize', syncHomeBar);
</script>
