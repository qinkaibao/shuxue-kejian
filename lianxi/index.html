<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>错题练习册</title>
<link rel="stylesheet" href="../common/play.css">
</head>
<body>
<div id="app"></div>
<template id="homeExtra">
  <div class="card">
    <h2 class="sec">先记住这三句</h2>
    <p class="say" id="rule">只有加、减，或只有乘、除：从左往右。</p>
    <button type="button" class="stepbtn" id="ruleBtn">下一句</button>
    <p>长度换算：往小单位走用乘法，往大单位走用除法。1 米 = 100 厘米，1 千米 = 1000 米。</p>
  </div>
</template>
<script src="../common/report.js"></script>
<script src="../common/play.js"></script>
<script src="questions.js"></script>
<script>
KejianPlay.start({
  key: 'lianxi_kejian_v1',
  shape: 'map',
  title: '错题练习册',
  report: { id: 'lianxi', name: '错题练习册', questions: window.LIANXI_REPORT },
  home: {
    h1: '📒 错题练习册',
    sub: '审题 · 运算顺序 · 竖式口算 · 长度单位',
    points: [
      { n: '1', t: '问的是什么？', d: '圈问题，看单位，划掉用不上的数' },
      { n: '2', t: '先算哪一步？', d: '同级从左往右；先乘除后加减；括号最优先' },
      { n: '3', t: '单位一致了吗？', d: '下楼做乘法，上楼做除法，再比大小' }
    ]
  },
  levels: window.LIANXI_LEVELS,
  homeHTML: document.getElementById('homeExtra').innerHTML,
  bindHome: function () {
    var lines = [
      '只有加、减，或只有乘、除：从左往右。',
      '既有乘除又有加减：先乘除，后加减。',
      '有括号：先算括号里面。'
    ];
    var i = 0;
    var btn = document.getElementById('ruleBtn');
    var rule = document.getElementById('rule');
    if (!btn) return;
    btn.onclick = function () {
      i = (i + 1) % lines.length;
      rule.textContent = lines[i];
    };
  }
});
</script>
</body>
</html>
