<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>错题练习册</title>
<link rel="stylesheet" href="../common/play.css">
</head>
<body>
<div id="app"></div>
<template id="homeExtra">
  <div class="card">
    <h2 class="sec">先记住这三句</h2>
    <p class="say" id="rule">只有加、减，或只有乘、除：从左往右。</p>
    <button type="button" class="stepbtn" id="ruleBtn">下一句</button>
    <p>长度换算：往小单位走用乘法，往大单位走用除法。1 米 = 100 厘米，1 千米 = 1000 米。</p>
  </div>
</template>
<script src="../common/report.js"></script>
<script src="../common/play.js"></script>
<script src="questions.js"></script>
<script>
KejianPlay.start({
  key: 'lianxi_kejian_v1',
  shape: 'map',
  title: '错题练习册',
  report: { id: 'lianxi', name: '错题练习册', questions: window.LIANXI_REPORT },
  home: {
    h1: '📒 错题练习册',
    sub: '审题 · 运算顺序 · 竖式口算 · 长度单位',
    points: [
      { n: '1', t: '问的是什么？', d: '圈问题，看单位，划掉用不上的数' },
      { n: '2', t: '先算哪一步？', d: '同级从左往右；先乘除后加减；括号最优先' },
      { n: '3', t: '单位一致了吗？', d: '下楼做乘法，上楼做除法，再比大小' }
    ]
  },
  levels: window.LIANXI_LEVELS,
  homeHTML: document.getElementById('homeExtra').innerHTML,
  bindHome: function () {
    var lines = [
      '只有加、减，或只有乘、除：从左往右。',
      '既有乘除又有加减：先乘除，后加减。',
      '有括号：先算括号里面。'
    ];
    var i = 0;
    var btn = document.getElementById('ruleBtn');
    var rule = document.getElementById('rule');
    if (!btn) return;
    btn.onclick = function () {
      i = (i + 1) % lines.length;
      rule.textContent = lines[i];
    };
  }
});
</script>
<p class="catline" style="margin:18px 12px 28px;padding:14px 16px;background:#fffdf8;border-radius:16px;box-shadow:0 3px 0 #f1c26b;font-size:20px;line-height:1.6">本页练习：<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E7%9C%8B%E5%9B%BE%E5%88%97%E5%BC%8F%E4%B8%8E%E6%95%B0%E9%87%8F%E5%85%B3%E7%B3%BB">看图列式与数量关系</a>、<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E5%90%8C%E7%BA%A7%E6%B7%B7%E5%90%88%E8%BF%90%E7%AE%97">同级混合运算</a>、<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E4%B8%A4%E7%BA%A7%E6%B7%B7%E5%90%88%E8%BF%90%E7%AE%97">两级混合运算</a>、<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E6%8B%AC%E5%8F%B7%E4%B8%8E%E8%BF%90%E7%AE%97%E9%A1%BA%E5%BA%8F">括号与运算顺序</a>、<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E5%8F%A3%E7%AE%97%E6%95%B0%E4%BD%8D%E4%B8%8E%E8%BF%9B%E9%80%80%E4%BD%8D">口算数位与进退位</a>、<a style="color:#1d5fd0;font-weight:bold" href="../cuoti/#cat-%E9%95%BF%E5%BA%A6%E5%8D%95%E4%BD%8D%E4%B8%8E%E6%8D%A2%E7%AE%97">长度单位与换算</a></p>
</body>
</html>
