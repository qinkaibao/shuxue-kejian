<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>说法找算法 · 数学闯关</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:20px}
body{margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;background:#fff8e7;color:#333;font-size:22px;line-height:1.5;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:1100px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 12px 40px}
/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff8e7;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:calc(4px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));box-shadow:0 2px 0 #f1c26b}
.hbtn{border:none;background:#ffd166;border-radius:12px;font-size:16px;min-width:0;height:36px;padding:0 8px;font-weight:bold;color:#5a3d00;box-shadow:0 2px 0 #e0a800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;white-space:nowrap}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e0a800}
.htitle{font-weight:bold;font-size:22px;color:#e8590c;white-space:nowrap}
.prog{flex:1 1 auto;min-width:72px}
.pbar{height:10px;background:#ffe8b0;border-radius:9px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#ffb703,#fb8500);border-radius:9px;transition:width .6s}
.ptxt{font-size:13px;color:#8a6d3b;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-size:24px;font-weight:bold;color:#e09f00;white-space:nowrap;display:flex;align-items:center;gap:4px}
.star{display:inline-block;width:28px;height:28px;vertical-align:middle}
/* cards */
.card{background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(200,140,0,.15);padding:16px 20px;margin:10px 0}
h1{font-size:34px;color:#e8590c;margin:10px 0 4px;text-align:center}
.sub{text-align:center;color:#8a6d3b;font-size:20px}
.entry{text-align:center;margin:14px 0 0;font-size:20px}
.entry a{color:#1d5fd0;font-weight:bold}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.three>div{background:#fff3d6;border-radius:16px;padding:12px;text-align:center}
.three .no{display:inline-block;width:40px;height:40px;line-height:40px;border-radius:50%;background:#fb8500;color:#fff;font-weight:bold;font-size:24px}
.three b{display:block;font-size:24px;margin:4px 0;color:#c2410c}
.three small{font-size:18px;color:#6b5a3a;display:block;line-height:1.4}
.flow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:20px}
.flow span{background:#e6f4ea;color:#1e7b34;border-radius:12px;padding:4px 12px;font-weight:bold}
.flow i{font-style:normal;color:#aaa}
.bigbtn{display:block;margin:16px auto 4px;border:none;border-radius:20px;background:#fb8500;color:#fff;font-size:28px;font-weight:bold;padding:14px 44px;box-shadow:0 5px 0 #c96a00;min-height:64px}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c96a00}
.bigbtn.green{background:#2fb344;box-shadow:0 5px 0 #1f8a30}
.bigbtn.blue{background:#3b82f6;box-shadow:0 5px 0 #1d5fd0}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:6px}
.lv{border:none;text-align:left;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 #f1c26b;display:flex;gap:14px;align-items:center;font-size:22px;min-height:100px;color:#333}
.lv:active{transform:translateY(2px)}
.lv .ic{font-size:44px;width:64px;height:64px;border-radius:16px;background:#fff3d6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lv b{display:block;font-size:24px;color:#c2410c}
.lv small{display:block;font-size:17px;color:#7a6a4a;line-height:1.35}
.lv .lvst{font-size:16px;color:#e09f00;margin-top:2px}
.lv.done{box-shadow:0 4px 0 #8fd19e;background:#f3fff5}
.lv.chal .ic{background:#ffe3ec}
.tips{font-size:17px;color:#6b5a3a;background:#f6f1e6;border-radius:14px;padding:8px 14px;margin-top:10px}
.tips summary{cursor:pointer;font-weight:bold;min-height:36px;line-height:36px}
/* question layout */
.qwrap{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:960px){.qwrap{grid-template-columns:1fr 270px}.board{position:sticky;top:calc(var(--hdr-h,56px) + 8px);align-self:start}}
@media (max-width:800px){.htitle{display:none}.hbtn{height:32px;font-size:14px;padding:0 7px;border-radius:10px}.pbar{height:8px}.ptxt{font-size:12px}}
.stages{display:flex;gap:6px;align-items:center;justify-content:center;margin:4px 0 0;font-size:18px}
.stages span{padding:3px 12px;border-radius:12px;background:#eee;color:#999}
.stages span.on{background:#2fb344;color:#fff;font-weight:bold}
.stages span.past{background:#c9efd1;color:#1e7b34}
.stages i{color:#ccc;font-style:normal}
.qtag{display:inline-block;background:#fb8500;color:#fff;border-radius:10px;padding:0 10px;font-size:17px;margin-bottom:4px}
.qtag.ch{background:#e64980}
.qtext{font-size:24px;line-height:1.7}
.qtext .n{color:#d6336c;font-weight:bold;font-size:26px;padding:0 1px}
.qtext .ask{border-bottom:3px dashed #f59f00;transition:all .4s;padding:0 2px}
.qtext .ask.circled{border:3px solid #e03131;border-radius:22px;padding:0 6px;background:#fff0f0}
.qtext .cond{font-weight:bold;background:#e6f4ea;border-radius:8px;padding:0 4px}
.infocards{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.infocards span{background:#eef5ff;border:2px solid #b7d3ff;border-radius:12px;padding:2px 12px;font-size:21px}
.infocards span.off{opacity:.35;text-decoration:line-through}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.tags span{background:#fff3bf;border:2px dashed #f59f00;border-radius:12px;padding:2px 14px;font-size:22px;font-weight:bold}
.diagBox{margin-top:6px;position:relative}
.diagBox svg{width:100%;height:auto;display:block;max-height:300px}
.replay{display:block;margin:0 0 0 auto;border:none;background:#eef5ff;color:#1d5fd0;border-radius:12px;font-size:16px;padding:4px 10px;min-height:36px}
.cap{background:#eef8ff;border-left:6px solid #3b82f6;border-radius:10px;padding:8px 12px;font-size:21px;margin-top:6px;min-height:46px}
/* step */
.step{min-height:160px}
.prompt{font-size:23px;font-weight:bold;color:#1f3b73;margin-bottom:8px}
.prompt .sg{display:inline-block;font-size:16px;color:#fff;background:#2fb344;border-radius:8px;padding:0 8px;margin-right:6px;vertical-align:middle;font-weight:normal}
.bubbles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bubble{flex:1;min-width:240px;background:#fffbe6;border:2px solid #ffe08a;border-radius:16px;padding:8px 12px;font-size:20px}
.bubble b{color:#c2410c}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:3px solid #cfe0ff;background:#f5f9ff;border-radius:16px;font-size:23px;padding:10px 14px;text-align:left;min-height:60px;color:#1f2d4d;transition:background .2s}
.opt.c{text-align:center;font-size:26px;font-weight:bold}
.opt.sel{border-color:#3b82f6;background:#dbeafe}
.opt.ok{border-color:#2fb344;background:#dcfce7}
.opt.bad{border-color:#f03e3e;background:#ffe3e3;animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:10px;font-size:21px;border-radius:14px;padding:0}
.fb .good{background:#dcfce7;color:#14692c;border-radius:14px;padding:8px 14px;font-weight:bold}
.fb .hint{background:#fff4e0;color:#9a4b00;border-radius:14px;padding:8px 14px}
.fb .exp{background:#e7f0ff;color:#1d3f8a;border-radius:14px;padding:8px 14px}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:16px;font-size:24px;font-weight:bold;padding:10px 28px;min-height:58px;color:#fff;background:#3b82f6;box-shadow:0 4px 0 #1d5fd0}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1d5fd0}
.btn.go{background:#2fb344;box-shadow:0 4px 0 #1f8a30}
.btn.gray{background:#adb5bd;box-shadow:0 4px 0 #868e96}
.btn[disabled]{opacity:.45}
/* equation & keypad */
.eqs{font-size:28px;line-height:2;margin:4px 0}
.eqline{white-space:nowrap;overflow-x:auto}
.blank{display:inline-block;min-width:72px;height:50px;line-height:44px;border:3px solid #9bbcf5;border-radius:12px;background:#fff;text-align:center;vertical-align:middle;font-weight:bold;color:#1d3f8a;margin:0 4px;cursor:pointer;padding:0 6px}
.blank.focus{border-color:#fb8500;box-shadow:0 0 0 4px #ffe1b3}
.blank.ok{border-color:#2fb344;background:#dcfce7}
.blank.bad{border-color:#f03e3e;background:#ffe3e3}
.units{display:inline-flex;gap:8px;vertical-align:middle;margin-left:6px}
.unit{border:3px solid #ffd8a8;background:#fff4e6;border-radius:12px;font-size:24px;min-width:62px;min-height:52px;font-weight:bold;color:#a14a00}
.unit.sel{border-color:#fb8500;background:#ffd8a8}
.unit.ok{border-color:#2fb344;background:#dcfce7;color:#14692c}
.unit.bad{border-color:#f03e3e;background:#ffe3e3}
.unitq{font-size:20px;color:#8a6d3b}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px;max-width:640px}
.pad button{border:none;background:#fff1d6;border-radius:14px;font-size:28px;font-weight:bold;min-height:58px;color:#5a3d00;box-shadow:0 3px 0 #f1c26b}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #f1c26b}
.pad .del{background:#ffe3e3;color:#c92a2a;box-shadow:0 3px 0 #f5a3a3}
/* sort */
.sortc{display:flex;flex-direction:column;gap:10px}
.sitem{display:flex;align-items:center;gap:10px;background:#f8fbff;border:2px solid #dbe7ff;border-radius:16px;padding:8px 10px;flex-wrap:wrap}
.sitem .st{flex:1;min-width:260px;font-size:21px}
.sitem .sb{display:flex;gap:8px}
.sitem .sb button{border:3px solid #cfe0ff;background:#fff;border-radius:12px;font-size:21px;font-weight:bold;min-height:52px;padding:0 12px}
.sitem.ok{border-color:#2fb344;background:#effcf2}
.sitem .sb button.ok{border-color:#2fb344;background:#dcfce7}
.sitem .sb button.bad{border-color:#f03e3e;background:#ffe3e3;animation:shake .4s}
.sitem .note{width:100%;font-size:20px}
/* board */
.board h3{margin:0 0 6px;font-size:22px;color:#c2410c}
.board ol{margin:0;padding-left:0;list-style:none}
.board li{font-size:21px;padding:6px 0;border-bottom:1px dashed #f0d9a8;animation:pop .4s}
.board li small{display:block;font-size:16px;color:#2b8a3e}
.board .empty{color:#bbb;font-size:18px}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
/* end */
.endbox{text-align:center}
.endstars{margin:10px 0}
.endstars .star{width:64px;height:64px;animation:pop .5s backwards}
.sum{background:#fff3d6;border-radius:16px;padding:12px 16px;font-size:23px;text-align:left;margin:10px 0}
.price{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.price span{background:#fff;border:3px solid #ffa94d;border-radius:30px;padding:2px 16px;font-size:22px}
.price span b{color:#d6336c}
@media (max-width:700px){html{font-size:18px}.three{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr}.htitle{display:none}.pad{grid-template-columns:repeat(4,1fr)}}
/* svg */
.rv{opacity:0;transition:opacity .6s}
.rv.on{opacity:1}
.grow{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;transition:transform .8s ease-out,opacity .3s;opacity:0}
.grow.on{transform:scaleX(1);opacity:1}
.dlab{font-size:20px;fill:#333;font-weight:bold}
.dtxt{font-size:19px;fill:#333}
.dtin{font-size:16px;fill:#fff;font-weight:bold}
.noanim *{transition:none!important}
/* v2 手机适配（仅窄屏生效，不改题目与逻辑） */
@media (max-width:700px){
.qwrap{grid-template-columns:minmax(0,1fr)}
.qwrap>div,.card,.step{min-width:0}
.card{padding:14px 14px}
.eqs{font-size:23px}
.eqline{white-space:normal}
.blank{min-width:56px;height:46px;line-height:40px;margin:0 3px}
.dlab{font-size:21px}.dtxt{font-size:23px}.dtin{font-size:20px}
.diagBox svg{max-height:none}
}

/* shuofa: preserve the original warm cards and generous mobile controls. */
.stages{flex-wrap:wrap}
.blank{font:inherit;font-weight:bold;min-height:50px}
.diagBox{overflow-x:auto}
.diagBox svg{min-width:360px}
.dlab{font-size:24px}.dtxt{font-size:24px}.dtin{font-size:20px}
.opt:focus-visible,.btn:focus-visible,.blank:focus-visible{outline:4px solid #fb8500;outline-offset:3px}
@media(max-width:420px){
 h1{font-size:30px}.card{padding:14px 12px}.lv b{font-size:22px}.lv .ic{width:50px;height:56px;font-size:36px}
 .hdr{gap:4px;padding-left:8px;padding-right:8px}.hbtn{padding:0 5px;font-size:13px}.prog{min-width:50px}
 .stages{font-size:16px;gap:4px}.stages span{padding:3px 8px}.qtext{font-size:23px}
 .eqs{font-size:22px}.blank{min-width:48px;padding:0 4px}.opt{font-size:22px}
 .diagBox::after{content:'线段图可左右滑动查看';display:block;font-size:15px;color:#8a6d3b;text-align:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    o.push('<g'+A(h.s,'rv')+' stroke="#444" stroke-width="2.5"><line x1="'+x1+'" y1="'+(y-BH/2-6)+'" x2="'+x1+'" y2="'+(y+BH/2+6)+'"/><line x1="'+(x1+w)+'" y1="'+(y-BH/2-6)+'" x2="'+(x1+w)+'" y2="'+(y+BH/2+6)+'"/></g>');

    var y=Y(b.r),dir=b.pos==='top'?-1:1,y0=y+dir*(BH/2+5),col=b.c?COL[b.c]:'#555';
    var ty=dir<0?y0-18-7:y0+18+21;
    o.push('<g'+A(b.s,'rv')+'><path d="'+bracePath(X(b.f),X(b.t),y0,dir)+'" fill="none" stroke="'+col+'" stroke-width="2.5"/><text class="dtxt" x="'+((X(b.f)+X(b.t))/2)+'" y="'+ty+'" text-anchor="middle" style="fill:'+(b.c?col:'#333')+';font-weight:bold">'+b.txt+'</text></g>');
  });
  (sp.texts||[]).forEach(function(t){
    o.push('<text'+A(t.s,'rv')+' x="'+X(t.x)+'" y="'+(Y(t.r)+8)+'" style="font-size:22px;font-weight:bold;fill:'+(COL[t.c]||'#333')+'">'+t.txt+'</text>');
  });
  o.push('</svg>');
  return o.join('');
}
function setDStep(st,instant){
  var box=$('#diag');if(!box)return;
  if(instant)box.classList.add('noanim');
  $$('[data-s]',box).forEach(function(e){if(+e.getAttribute('data-s')<=st)e.classList.add('on');else e.classList.remove('on');});
  if(instant){box.offsetWidth;setTimeout(function(){box.classList.remove('noanim');},50);}
}
function showDiagram(final){
  replayRun++;
  var q=curQ(),box=$('#diag');
  box.innerHTML=svgDiagram(q.diagram)+(final?'<button class="replay" onclick="replayDiagram()">↻ 再看一遍</button>':'');
  if(final)setDStep(99,true);
}
function replayDiagram(){
  var q=curQ(),box=$('#diag'),n=q.diagram.caps.length-1,k=0,run=++replayRun;
  box.innerHTML=svgDiagram(q.diagram)+'<div class="cap" id="rcap">'+q.diagram.caps[0]+'</div>';
  box.offsetWidth;
  function alive(){return run===replayRun&&box===$('#diag')&&S.screen==='q';}
  (function nx(){
    if(!alive())return;
    k++;
    if(k>n){setTimeout(function(){if(alive())showDiagram(true);},1800);return;}
    setDStep(k);var c=$('#rcap');if(c)c.innerHTML=q.diagram.caps[k];setTimeout(nx,2200);
  })();
}
/* ---------- 步骤 ---------- */
function stepHead(st){
  var tag=st.ans?'答':STG[st.st];
  return '<div class="prompt"><span class="sg">'+tag+'</span>'+st.p+'</div>'+
   (st.bubbles?'<div class="bubbles">'+st.bubbles.map(function(b){return '<div class="bubble">'+b+'</div>';}).join('')+'</div>':'');
}
function renderStep(){
  var q=curQ();
  if(S.si>=q.steps.length){finishQ();return;}
  var st=q.steps[S.si];S.att=0;S.busy=false;KP.blanks=[];KP.onEnter=null;
  setStages(st.st);
  var el=$('#step');
  el.innerHTML=stepHead(st)+'<div id="body"></div><div class="fb" id="fb" role="status" aria-live="polite"></div><div class="row" id="btns"></div>';
  ({choice:stChoice,multi:stMulti,num:stNum,blanks:stBlanks,diagram:stDiagram,sort:stSort})[st.type](st,$('#body'));
}
function fb(cls,html){$('#fb').innerHTML='<div class="'+cls+'">'+html+'</div>';}
function nextBtn(label){
  $('#btns').innerHTML='<button class="btn go" id="nextB" onclick="nextStep()">'+(label||'下一步 ▶')+'</button>';
  var b=$('#nextB');if(b&&b.scrollIntoView){try{b.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}}
}
function nextStep(){S.si++;renderStep();var s=$('#step');if(s&&s.getBoundingClientRect().top<60){try{s.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}}}
function complete(st,explained){
  S.busy=true;
  if(explained)S.exp++;
  if(st.bd)st.bd.forEach(function(x){S.board.push(x);});
  if(st.bdNote&&S.board.length){var last=S.board[S.board.length-1];S.board[S.board.length-1]=[last[0],st.bdNote];}
  renderBoard();
  if(st.circle)$$('#qtext .ask').forEach(function(e){e.classList.add('circled');});
  if(st.offCard!==undefined){var c=$$('#icards span')[st.offCard];if(c)c.classList.add('off');}
  if(!explained)fb('good','✓ '+pick(PRAISE)+(st.good?' '+st.good:''));
  nextBtn();
}
/* 答错：第一次提示，第二次讲解 */
function wrong(st,hint,reveal){
  S.att++;
  if(window.KejianReport)KejianReport.miss(curQ().id,S._lastWrong||'答错');
  if(S.att===1){fb('hint','💡 提示：'+(hint||'再读圈出的问句，想想每个数表示什么。')+'<br>再试一次！');return false;}
  fb('exp','📖 讲解：'+(st.exp||''));
  if(reveal)reveal();
  complete(st,true);
  return true;
}
function stChoice(st,b){
  b.innerHTML='<div class="opts '+(st.cols||'')+'">'+st.opts.map(function(o,i){return '<button class="opt'+(st.center?' c':'')+'" data-i="'+i+'">'+o+'</button>';}).join('')+'</div>';
  $$('.opt',b).forEach(function(btn){btn.onclick=function(){
    if(S.busy)return;var i=+btn.getAttribute('data-i');
    if(i===st.a){btn.classList.add('ok');$$('.opt',b).forEach(function(x){x.disabled=true;});complete(st,false);}
    else{btn.classList.remove('bad');void btn.offsetWidth;btn.classList.add('bad');
      S._lastWrong='选了「'+st.opts[i]+'」';
      wrong(st,st.hint,function(){$$('.opt',b)[st.a].classList.add('ok');$$('.opt',b).forEach(function(x){x.disabled=true;});});}
  };});
}
function stMulti(st,b){
  b.innerHTML='<div class="opts">'+st.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">☐ '+o+'</button>';}).join('')+'</div>';
  $$('.opt',b).forEach(function(btn){btn.onclick=function(){if(S.busy)return;btn.classList.toggle('sel');btn.innerHTML=(btn.classList.contains('sel')?'☑ ':'☐ ')+st.opts[+btn.getAttribute('data-i')];};});
  $('#btns').innerHTML='<button class="btn" id="chk">检查 ✓</button>';
  $('#chk').onclick=function(){
    if(S.busy)return;
    var sel=$$('.opt',b).filter(function(x){return x.classList.contains('sel');}).map(function(x){return +x.getAttribute('data-i');});
    if(!sel.length){fb('hint','先点选你需要的卡片哦。');return;}
    var ok=sel.length===st.a.length&&st.a.every(function(i){return sel.indexOf(i)>=0;});
    function show(){$$('.opt',b).forEach(function(x,i){x.disabled=true;x.classList.remove('sel');var need=st.a.indexOf(i)>=0;x.innerHTML=(need?'☑ ':'☐ ')+st.opts[i];if(need)x.classList.add('ok');});}
    if(ok){show();complete(st,false);}
    else{$$('.opt',b).forEach(function(x){if(x.classList.contains('sel')&&st.a.indexOf(+x.getAttribute('data-i'))<0){x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');}});
      S._lastWrong='选了「'+sel.map(function(i){return st.opts[i];}).join('、')+'」';
      if(wrong(st,st.hint,show))return;}
  };
}
/* 数字键盘 */
var KP={blanks:[],cur:0,onEnter:null};
function padHTML(){
  var k=[1,2,3,4,5,6,7,8,9,0];
  return '<div class="pad">'+k.map(function(n){return '<button data-k="'+n+'">'+n+'</button>';}).join('')+'<button class="del" data-k="del">⌫</button><button class="del" data-k="clr" style="font-size:20px">清空</button></div>';
}
function bindPad(root){
  $$('.pad button',root).forEach(function(btn){btn.onclick=function(){padKey(btn.getAttribute('data-k'));};});
  $$('.blank',root).forEach(function(bl,i){bl.onclick=function(){if(S.busy)return;focusBlank(i);};});
}
function focusBlank(i){KP.cur=i;KP.blanks.forEach(function(b,j){b.classList.toggle('focus',j===i);});}
function padKey(k){
  if(S.busy)return;var b=KP.blanks[KP.cur];if(!b)return;
  if(b.classList.contains('ok'))return;
  b.classList.remove('bad');
  var v=b.textContent;
  if(k==='del')v=v.slice(0,-1);else if(k==='clr')v='';else if(v.length<3)v=(v==='0'?'':v)+k;
  b.textContent=v;
}
document.addEventListener('keydown',function(e){
  if(S.screen!=='q'||!KP.blanks.length||!document.body.contains(KP.blanks[0]))return;
  if(/^[0-9]$/.test(e.key)){padKey(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){padKey('del');e.preventDefault();}
  else if(e.key==='Enter'&&KP.onEnter){KP.onEnter();e.preventDefault();}
});
function stNum(st,b){
  var h='<div class="eqs"><div class="eqline">'+st.expr+' <span class="blank"></span>';
  if(st.units)h+='</div><div><span class="unitq">单位：</span><span class="units">'+st.units.map(function(u){return '<button class="unit" data-u="'+u+'">'+u+'</button>';}).join('')+'</span>';
  else h+=' （'+(st.unit||'只')+'）';
  b.innerHTML=h+'</div></div>'+padHTML();
  if(!st.units){var m=st.exp.match(/（(.+?)）/);$('.eqline',b).lastChild.textContent=' （'+(m?m[1]:'')+'）';}
  var unit=null;
  $$('.unit',b).forEach(function(u){u.onclick=function(){if(S.busy)return;$$('.unit',b).forEach(function(x){x.classList.remove('sel','bad');});u.classList.add('sel');unit=u.getAttribute('data-u');};});
  KP.blanks=$$('.blank',b);bindPad(b);focusBlank(0);
  $('#btns').innerHTML='<button class="btn" id="chk">检查 ✓</button>';
  var check=function(){
    if(S.busy)return;var bl=KP.blanks[0],v=bl.textContent;
    if(v===''){fb('hint','先用下面的数字键填上得数哦。');return;}
    if(st.units&&!unit){fb('hint','别忘了点一个单位：它是什么？单位是什么？');return;}
    var nOk=+v===st.a,uOk=!st.units||unit===st.u;
    if(nOk)bl.classList.add('ok');else bl.classList.add('bad');
    if(st.units){var us=$('.unit.sel',b);if(us)us.classList.add(uOk?'ok':'bad');}
    if(nOk&&uOk){complete(st,false);return;}
    var hint=!nOk?(st.hint||'再仔细算一算。'):st.uhint;
    S._lastWrong='填了 '+v+(unit?unit:'');
    wrong(st,hint,function(){bl.textContent=st.a;bl.classList.remove('bad');bl.classList.add('ok');
      if(st.units)$$('.unit',b).forEach(function(x){x.classList.remove('sel','bad');if(x.getAttribute('data-u')===st.u)x.classList.add('ok');});});
  };
  $('#chk').onclick=check;KP.onEnter=check;
}
function stBlanks(st,b){
  var h='<div class="eqs">'+st.lines.map(function(l){return '<div class="eqline">'+l.replace(/\{\}/g,'<button type="button" class="blank" aria-label="点此填写数字"></button>')+'</div>';}).join('')+'</div>';
  b.innerHTML=h+padHTML();
  KP.blanks=$$('.blank',b);bindPad(b);focusBlank(0);
  $('#btns').innerHTML='<button class="btn" id="chk">检查 ✓</button>';
  var check=function(){
    if(S.busy)return;
    var empty=KP.blanks.findIndex?KP.blanks.findIndex(function(x){return x.textContent==='';}):-1;
    if(empty<0)for(var e=0;e<KP.blanks.length;e++)if(KP.blanks[e].textContent===''){empty=e;break;}
    if(empty>=0){fb('hint','还有空没填哦（点一下方框就能换位置）。');focusBlank(empty);return;}
    var all=true;
    KP.blanks.forEach(function(x,i){if(+x.textContent===st.a[i])x.classList.add('ok');else{x.classList.add('bad');all=false;}});
    if(all){complete(st,false);return;}
    var firstBad=0;for(var j=0;j<KP.blanks.length;j++)if(!KP.blanks[j].classList.contains('ok')){firstBad=j;break;}
    focusBlank(firstBad);
    S._lastWrong='填了 '+KP.blanks.map(function(x){return x.textContent||'空';}).join('、');
    wrong(st,st.hint||'红色的方框再算一算。',function(){KP.blanks.forEach(function(x,i){x.textContent=st.a[i];x.classList.remove('bad');x.classList.add('ok');});});
  };
  $('#chk').onclick=check;KP.onEnter=check;
}
function stDiagram(st,b){
  var q=curQ(),caps=q.diagram.caps,n=caps.length-1;
  S.dstep=0;showDiagram(false);
  b.innerHTML='<div class="cap" id="cap">'+caps[0]+'</div>';
  var box=$('#diag');box.offsetWidth;
  function upd(){
    $('#cap').innerHTML=caps[S.dstep];
    if(S.dstep<n)$('#btns').innerHTML='<button class="btn" id="dn">下一步 ▶（'+S.dstep+'/'+n+'）</button>';
    else{$('#btns').innerHTML='<button class="btn go" id="dn">看懂了，继续 ▶</button>';}
    $('#dn').onclick=adv;
  }
  function adv(){
    if(S.dstep<n){S.dstep++;setDStep(S.dstep);upd();}
    else{S.diagDone=true;box.onclick=null;var r=document.createElement('button');r.className='replay';r.textContent='↻ 再看一遍';r.onclick=function(e){e.stopPropagation();replayDiagram();};box.appendChild(r);nextStep();}
  }
  box.onclick=function(){if(S.dstep<n)adv();};
  upd();
  try{box.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}
function stSort(st,b){
  var left=st.items.length,anyExp=false;
  b.innerHTML='<div class="sortc">'+st.items.map(function(it,i){return '<div class="sitem" data-i="'+i+'"><div class="st">'+it.t+'</div><div class="sb">'+st.btns.map(function(bt,j){return '<button data-j="'+j+'">'+bt+'</button>';}).join('')+'</div><div class="note"></div></div>';}).join('')+'</div>';
  $$('.sitem',b).forEach(function(row){
    var it=st.items[+row.getAttribute('data-i')],att=0,doneRow=false;
    $$('.sb button',row).forEach(function(btn){btn.onclick=function(){
      if(doneRow)return;var j=+btn.getAttribute('data-j');
      if(j===it.a){btn.classList.add('ok');row.classList.add('ok');doneRow=true;$('.note',row).innerHTML=att?'<span style="color:#14692c">✓ 对了！</span>':'<span style="color:#14692c">✓ '+pick(PRAISE)+'</span>';left--;}
      else{att++;if(window.KejianReport)KejianReport.miss(curQ().id,'把「'+it.t+'」选成「'+st.btns[j]+'」');btn.classList.remove('bad');void btn.offsetWidth;btn.classList.add('bad');
        if(att===1)$('.note',row).innerHTML='<span style="color:#9a4b00">💡 '+it.hint+'</span>';
        else{anyExp=true;doneRow=true;$$('.sb button',row)[it.a].classList.add('ok');row.classList.add('ok');$('.note',row).innerHTML='<span style="color:#1d3f8a">📖 '+it.hint+' 所以是 '+st.btns[it.a]+'。</span>';left--;}}
      if(left===0){if(anyExp){S.exp++;fb('exp','📖 '+st.exp);S.busy=true;nextBtn();}else complete(st,false);}
    };});
  });
}
function finishQ(){
  var q=curQ(),l=LEVELS[S.L],stars=S.exp===0?3:(S.exp===1?2:1);
  S.prog[q.id]=Math.max(S.prog[q.id]||0,stars);save();
  if(window.KejianReport)KejianReport.pass(q.id);
  setStages(3);
  var last=S.Q>=l.qs.length-1;
  var el=$('#step');
  el.innerHTML='<div class="endbox"><div class="prompt" style="font-size:28px">🎉 第 '+(S.Q+1)+' 题完成！</div><div class="endstars">'+[0,1,2].map(function(i){return starSVG(i<stars).replace('class="star"','class="star" style="animation-delay:'+(i*0.25)+'s"');}).join('')+'</div>'+
   '<div style="font-size:20px;color:#8a6d3b">'+(stars===3?'一次讲解都没看，太棒了！':'看了讲解也没关系，下次自己想出来！')+'</div>'+
   (last?'<div class="sum">⭐ 这一关记住：<br>'+l.sum+'</div>':'')+
   '<div class="row" style="justify-content:center">'+(last?(S.L<LEVELS.length-1?'<button class="btn go" onclick="startLevel('+(S.L+1)+')">下一关 ▶</button>':'<button class="btn go" onclick="allDone()">完成全部 🎊</button>')+'<button class="btn" onclick="goMap()">回关卡地图</button>':'<button class="btn go" onclick="S.Q++;startQ()">下一题 ▶</button>')+'</div></div>';
  var sn=$('#starN');if(sn)sn.textContent=totalStars();
  var pf=$('.pfill');if(pf)pf.style.width=(doneCount()/TOTAL*100)+'%';
  var pt=$('.ptxt');if(pt)pt.textContent='已完成 '+doneCount()+' / '+TOTAL+' 题 · ★ '+totalStars();
  try{el.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}
function allDone(){
  S.screen='map';render();
  var d=document.createElement('div');d.className='card endbox';
  d.innerHTML='<div class="prompt" style="font-size:28px">🎊 全部闯关完成！一共得到 '+totalStars()+' 颗星</div><div class="sum">以后遇到新说法：<br>① 圈出问谁、求什么。② 用自己的话说关系，必要时画图。③ 找对算法，再检查数和单位。</div>';
  app.insertBefore(d,app.children[1]);
}
(function mountReport(){
  if(!window.KejianReport)return;
  var tags={'1':'每人平分→除法','2':'谁比谁多/少·换说法','3':'几倍vs多几','4':'还剩还差与总数','5':'综合·选条件与顺序'};
  var qs=[],legacy=[];
  LEVELS.forEach(function(l,li){
    l.qs.forEach(function(q,qi){
      var mark=q.text.match(/\[\[(.+?)\]\]/);
      var brief=mark?mark[1].replace(/<[^>]+>/g,''):q.text.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').slice(0,22);
      qs.push({id:q.id,brief:'第'+(li+1)+'关第'+(qi+1)+'题 '+brief,tag:tags[String(li+1)]||'数量关系',category:'看图列式与数量关系'});
      if(S.prog[q.id])legacy.push(q.id);
    });
  });
  KejianReport.mount({id:'shuofa',name:'说法找算法',questions:qs,legacySolved:legacy});
})();
render();

</script>
