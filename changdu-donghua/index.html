<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff8e7">
<title>毫米到千米</title>
<style>
:root{
  --ink:#2b2b3a;--muted:#6b6b80;--bg:#fff8e7;--card:#fffdf8;
  --pri:#c45c26;--blue:#1d6fa5;--green:#2fa36b;--red:#e5484d;
  --gold:#f4a261;--bar:#fff3d6;--sn-h:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
html,body{height:100%}
body{
  margin:0;min-height:100%;height:100%;height:100dvh;
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  display:flex;flex-direction:column;
  padding:0 0 env(safe-area-inset-bottom,0);
  overflow:hidden;
}
body.has-site-nav{height:100dvh}
.stage-wrap{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  max-width:720px;width:100%;margin:0 auto;padding:8px 12px 0;
}
.toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:4px 2px 8px;
}
.toolbar h1{
  margin:0;font-size:clamp(18px,5vw,24px);color:var(--pri);
  letter-spacing:1px;flex:1 1 auto;line-height:1.25;
}
.btn{
  border:none;border-radius:12px;min-height:40px;padding:0 14px;
  font-size:16px;font-weight:800;font-family:inherit;
  background:#ffd166;color:#5a3d00;box-shadow:0 2px 0 #e0a800;
  cursor:pointer;flex:0 0 auto;
}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #e0a800}
.btn.ghost{background:#fff;border:2px solid #f1c26b;box-shadow:none;color:#8a5a09}
.btn.big{
  min-height:52px;font-size:20px;padding:0 22px;border-radius:16px;
  background:var(--green);color:#fff;box-shadow:0 3px 0 #1e7a48;
}
.stage{
  position:relative;flex:1 1 auto;min-height:0;
  background:var(--card);border:3px solid #f1c26b;border-radius:22px;
  box-shadow:0 8px 0 #efc77a;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.stage svg{width:100%;height:100%;display:block;max-height:100%}
.progress{
  display:flex;justify-content:center;gap:5px;padding:8px 4px 6px;flex-wrap:wrap;
}
.dot{
  width:9px;height:9px;border-radius:50%;background:#e8d4a8;
  transition:transform .2s,background .2s;cursor:pointer;
}
.dot.on{background:var(--pri);transform:scale(1.4)}
.dot.done{background:#f4a261}
.narr{
  flex:0 0 auto;
  margin:0 12px calc(8px + env(safe-area-inset-bottom,0));
  max-width:720px;width:calc(100% - 24px);align-self:center;
  background:var(--bar);border:3px solid #f1c26b;border-radius:18px;
  padding:12px 14px;min-height:92px;
  box-shadow:0 4px 0 #efc77a;
}
.narr .scene-label{
  display:inline-block;font-size:13px;font-weight:800;color:#9a6200;
  background:#ffe8a8;border-radius:999px;padding:2px 10px;margin-bottom:6px;
}
.narr .text{
  margin:0;font-size:clamp(17px,4.6vw,21px);line-height:1.55;font-weight:700;
  color:var(--ink);
}
.end-overlay{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(255,248,231,.94);
  z-index:5;text-align:center;padding:20px;
}
.end-overlay.show{display:flex}
.end-overlay b{font-size:clamp(20px,5.5vw,28px);color:var(--pri)}
.end-overlay p{margin:0;font-size:17px;color:var(--muted);font-weight:600;max-width:18em;line-height:1.55}
@media(max-height:620px){
  .narr{min-height:72px;padding:10px 12px}
  .narr .text{font-size:16px}
  .toolbar h1{font-size:17px}
}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="toolbar">
    <h1>📏 毫米到千米</h1>
    <button type="button" class="btn" id="btnPlay" aria-pressed="true">⏸ 暂停</button>
    <button type="button" class="btn ghost" id="btnReplay">↺ 重播</button>
  </div>
  <div class="stage" id="stage" aria-live="polite">
    <svg id="canvas" viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="长度单位讲解动画"></svg>
    <div class="end-overlay" id="endOverlay">
      <b>毫米到千米，讲完啦</b>
      <p>选对单位 · 对准再量 · 不对齐就用终点减起点 · 弯的先拉直 · 进率记牢。</p>
      <button type="button" class="btn big" id="btnAgain">再看一遍</button>
    </div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
</div>
<div class="narr" id="narr">
  <span class="scene-label" id="sceneLabel">第 1 幕</span>
  <p class="text" id="narrText">准备开始……</p>
</div>

<script>
(function () {
  'use strict';

  var svgNS = 'http://www.w3.org/2000/svg';
  var canvas = document.getElementById('canvas');
  var narrText = document.getElementById('narrText');
  var sceneLabel = document.getElementById('sceneLabel');
  var progressEl = document.getElementById('progress');
  var endOverlay = document.getElementById('endOverlay');
  var btnPlay = document.getElementById('btnPlay');
  var btnReplay = document.getElementById('btnReplay');
  var btnAgain = document.getElementById('btnAgain');

  function el(name, attrs, kids) {
    var n = document.createElementNS(svgNS, name);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'textContent') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function clear() {
    while (canvas.firstChild) canvas.removeChild(canvas.firstChild);
  }

  function defsCommon() {
    return el('defs', null, [
      el('linearGradient', { id: 'sky', x1: '0', y1: '0', x2: '0', y2: '1' }, [
        el('stop', { offset: '0', 'stop-color': '#FFE8C2' }),
        el('stop', { offset: '1', 'stop-color': '#FFF8EE' })
      ]),
      el('linearGradient', { id: 'sky2', x1: '0', y1: '0', x2: '0', y2: '1' }, [
        el('stop', { offset: '0', 'stop-color': '#D6ECFF' }),
        el('stop', { offset: '1', 'stop-color': '#FFF8EE' })
      ]),
      el('linearGradient', { id: 'wood', x1: '0', y1: '0', x2: '0', y2: '1' }, [
        el('stop', { offset: '0', 'stop-color': '#F5D4A0' }),
        el('stop', { offset: '1', 'stop-color': '#D4A05A' })
      ]),
      el('linearGradient', { id: 'pencil', x1: '0', y1: '0', x2: '1', y2: '0' }, [
        el('stop', { offset: '0', 'stop-color': '#FFD166' }),
        el('stop', { offset: '0.85', 'stop-color': '#F4A261' }),
        el('stop', { offset: '1', 'stop-color': '#E76F51' })
      ]),
      el('linearGradient', { id: 'grass', x1: '0', y1: '0', x2: '0', y2: '1' }, [
        el('stop', { offset: '0', 'stop-color': '#B8E0A8' }),
        el('stop', { offset: '1', 'stop-color': '#7CB86A' })
      ]),
      el('linearGradient', { id: 'road', x1: '0', y1: '0', x2: '0', y2: '1' }, [
        el('stop', { offset: '0', 'stop-color': '#9AA3B2' }),
        el('stop', { offset: '1', 'stop-color': '#6E7685' })
      ]),
      el('filter', { id: 'soft', x: '-25%', y: '-25%', width: '150%', height: '150%' }, [
        el('feDropShadow', { dx: '0', dy: '2', stdDeviation: '2.2', 'flood-color': '#5c4033', 'flood-opacity': '0.18' })
      ])
    ]);
  }

  function bg(kind) {
    var fill = kind === 'blue' ? 'url(#sky2)' : 'url(#sky)';
    return el('g', null, [
      el('rect', { width: '360', height: '280', fill: fill }),
      el('ellipse', { cx: '55', cy: '34', rx: '28', ry: '12', fill: '#fff', opacity: '0.55' }),
      el('ellipse', { cx: '78', cy: '32', rx: '16', ry: '9', fill: '#fff', opacity: '0.4' }),
      el('ellipse', { cx: '290', cy: '28', rx: '32', ry: '13', fill: '#fff', opacity: '0.45' }),
      el('circle', { cx: '325', cy: '40', r: '20', fill: '#FFE08A', opacity: '0.4' }),
      el('circle', { cx: '325', cy: '40', r: '13', fill: '#FFD166' }),
      el('rect', { y: '232', width: '360', height: '48', fill: 'url(#grass)' }),
      el('ellipse', { cx: '36', cy: '240', rx: '20', ry: '8', fill: '#6aa85a', opacity: '0.5' }),
      el('ellipse', { cx: '310', cy: '244', rx: '24', ry: '9', fill: '#6aa85a', opacity: '0.45' })
    ]);
  }

  function xiaomei(x, y, scale, face) {
    scale = scale || 1;
    var g = el('g', { transform: 'translate(' + x + ',' + y + ') scale(' + scale + ')', filter: 'url(#soft)' });
    g.appendChild(el('ellipse', { cx: '0', cy: '54', rx: '18', ry: '6', fill: '#5c4033', opacity: '0.15' }));
    g.appendChild(el('ellipse', { cx: '0', cy: '38', rx: '16', ry: '20', fill: '#5B8DEF' }));
    g.appendChild(el('rect', { x: '-10', y: '48', width: '8', height: '10', rx: '2', fill: '#3d5a80' }));
    g.appendChild(el('rect', { x: '2', y: '48', width: '8', height: '10', rx: '2', fill: '#3d5a80' }));
    g.appendChild(el('circle', { cx: '0', cy: '8', r: '16', fill: '#FFE0BD' }));
    g.appendChild(el('path', { d: 'M-17 2 Q-10 -16 0 -12 Q10 -16 17 2 Q8 -2 0 0 Q-8 -2 -17 2', fill: '#5C3A1E' }));
    g.appendChild(el('circle', { cx: '-14', cy: '12', r: '4.5', fill: '#FF9EB5', opacity: '0.85' }));
    g.appendChild(el('circle', { cx: '14', cy: '12', r: '4.5', fill: '#FF9EB5', opacity: '0.85' }));
    g.appendChild(el('circle', { cx: '-5', cy: '8', r: '2.2', fill: '#2b2b3a' }));
    g.appendChild(el('circle', { cx: '5', cy: '8', r: '2.2', fill: '#2b2b3a' }));
    if (face === 'think') {
      g.appendChild(el('path', { d: 'M-4 16 Q0 14 4 16', stroke: '#2b2b3a', 'stroke-width': '1.6', fill: 'none', 'stroke-linecap': 'round' }));
    } else if (face === 'wow') {
      g.appendChild(el('ellipse', { cx: '0', cy: '15', rx: '3', ry: '4', fill: '#2b2b3a' }));
    } else if (face === 'sad') {
      g.appendChild(el('path', { d: 'M-4 17 Q0 14 4 17', stroke: '#2b2b3a', 'stroke-width': '1.6', fill: 'none', 'stroke-linecap': 'round' }));
    } else if (face === 'wrong') {
      g.appendChild(el('path', { d: 'M-4 17 Q0 14 4 17', stroke: '#2b2b3a', 'stroke-width': '1.6', fill: 'none', 'stroke-linecap': 'round' }));
      g.appendChild(el('line', { x1: '-8', y1: '4', x2: '-2', y2: '7', stroke: '#2b2b3a', 'stroke-width': '1.4', 'stroke-linecap': 'round' }));
      g.appendChild(el('line', { x1: '2', y1: '7', x2: '8', y2: '4', stroke: '#2b2b3a', 'stroke-width': '1.4', 'stroke-linecap': 'round' }));
    } else {
      g.appendChild(el('path', { d: 'M-5 15 Q0 19 5 15', stroke: '#2b2b3a', 'stroke-width': '1.8', fill: 'none', 'stroke-linecap': 'round' }));
    }
    return g;
  }

  function txt(x, y, text, opts) {
    opts = opts || {};
    var t = el('text', {
      x: String(x), y: String(y),
      fill: opts.fill || '#2b2b3a',
      'font-size': String(opts.size || 15),
      'font-weight': String(opts.weight || 700),
      'text-anchor': opts.anchor || 'middle',
      'font-family': '-apple-system,PingFang SC,Microsoft YaHei,sans-serif'
    });
    t.textContent = text;
    return t;
  }

  function badge(x, y, w, h, fill, stroke) {
    return el('rect', {
      x: String(x), y: String(y), width: String(w), height: String(h), rx: '12',
      fill: fill || '#fff', stroke: stroke || '#f1c26b', 'stroke-width': '3', filter: 'url(#soft)'
    });
  }

  function arrowH(x1, x2, y, color) {
    color = color || '#c45c26';
    var left = Math.min(x1, x2), right = Math.max(x1, x2);
    return el('g', null, [
      el('line', { x1: String(left), y1: String(y), x2: String(right), y2: String(y), stroke: color, 'stroke-width': '3', 'stroke-linecap': 'round' }),
      el('polygon', { points: left + ',' + y + ' ' + (left + 7) + ',' + (y - 5) + ' ' + (left + 7) + ',' + (y + 5), fill: color }),
      el('polygon', { points: right + ',' + y + ' ' + (right - 7) + ',' + (y - 5) + ' ' + (right - 7) + ',' + (y + 5), fill: color })
    ]);
  }

  /* 尺子：cm 刻度，可选起止高亮与标注 */
  function ruler(x, y, cmCount, opts) {
    opts = opts || {};
    var pxPerCm = opts.pxPerCm || 12;
    var w = cmCount * pxPerCm;
    var g = el('g', { filter: 'url(#soft)' });
    g.appendChild(el('rect', {
      x: String(x), y: String(y), width: String(w), height: '30', rx: '4',
      fill: 'url(#wood)', stroke: '#b8843a', 'stroke-width': '1.5'
    }));
    for (var i = 0; i <= cmCount; i++) {
      var tx = x + i * pxPerCm;
      var h = (i % 5 === 0) ? 16 : 9;
      g.appendChild(el('line', {
        x1: String(tx), y1: String(y), x2: String(tx), y2: String(y + h),
        stroke: '#5c4033', 'stroke-width': i % 5 === 0 ? '1.6' : '1'
      }));
      if (i % 5 === 0 || opts.labelAll) {
        g.appendChild(txt(tx, y + 26, String(i), { size: 9, fill: '#5c4033' }));
      }
    }
    if (opts.mark0) {
      g.appendChild(el('circle', { cx: String(x), cy: String(y - 4), r: '4', fill: '#2fa36b' }));
    }
    return g;
  }

  function pill(x, y, label, ok) {
    var fill = ok ? '#eafaf1' : '#fff0ee';
    var stroke = ok ? '#2fa36b' : '#e5484d';
    var g = el('g', { filter: 'url(#soft)' });
    g.appendChild(el('rect', { x: String(x), y: String(y), width: '110', height: '36', rx: '18', fill: fill, stroke: stroke, 'stroke-width': '3' }));
    g.appendChild(txt(x + 55, y + 24, label, { size: 15, fill: stroke }));
    return g;
  }

  /* ========== 15 幕 ========== */
  var scenes = [
    /* 1 */
    {
      title: '什么是长度',
      duration: 10000,
      narr: '长度，就是物体从一头到另一头有多长。小美的铅笔，从笔尖量到橡皮这一头，这一段就是它的长度。',
      draw: function (t) {
        clear(); canvas.appendChild(defsCommon()); canvas.appendChild(bg());
        canvas.appendChild(xiaomei(48, 155, 1.05, 'happy'));
        var px = 105, py = 125, pw = 190;
        var reveal = Math.min(1, t / 0.3);
        var curW = pw * reveal;
        var g = el('g', { filter: 'url(#soft)' });
        g.appendChild(el('rect', { x: String(px), y: String(py), width: String(Math.max(1, curW)), height: '22', rx: '4', fill: 'url(#pencil)' }));
        if (reveal > 0.85) {
          g.appendChild(el('polygon', { points: px + ',' + (py + 11) + ' ' + (px + 14) + ',' + py + ' ' + (px + 14) + ',' + (py + 22), fill: '#E76F51' }));
          g.appendChild(el('rect', { x: String(px + pw - 18), y: String(py), width: '18', height: '22', rx: '3', fill: '#FF8FAB' }));
        }
        canvas.appendChild(g);
        if (t > 0.35) {
          var a = Math.min(1, (t - 0.35) / 0.3);
          canvas.appendChild(arrowH(px, px + Math.max(24, pw * a), py - 18));
          if (a > 0.9) canvas.appendChild(txt(px + pw / 2, py - 30, '长度 = 从一头到另一头', { size: 15, fill: '#c45c26' }));
        }
        canvas.appendChild(txt(200, 210, '铅笔的长度', { size: 17, fill: '#5a3d00' }));
      }
    },
    /* 2 */
    {
      title: '五个长度单位',
      duration: 14000,
      narr: '量长短常用五个单位：毫米、厘米、分米、米、千米。生活里「公里」就是「千米」，只是叫法不同。',
      draw: function (t) {
        clear(); canvas.appendChild(defsCommon()); canvas.appendChild(bg('blue'));
        canvas.appendChild(xiaomei(40, 200, 0.85, 'wow'));
        var units = [
          { name: '毫米', en: 'mm', c: '#2fa36b' },
          { name: '厘米', en: 'cm', c: '#c45c26' },
          { name: '分米', en: 'dm', c: '#8b5cf6' },
          { name: '米', en: 'm', c: '#1d6fa5' },
          { name: '千米', en: 'km', c: '#e5484d' }
        ];
        units.forEach(function (u, i) {
          if (t < 0.08 + i * 0.12) return;
          var x = 30 + i * 64;
          canvas.appendChild(el('rect', {
            x: String(x), y: '55', width: '58', height: '88', rx: '14',
            fill: '#fff', stroke: u.c, 'stroke-width': '3', filter: 'url(#soft)'
          }));
          canvas.appendChild(txt(x + 29, 92, u.name, { size: 16, fill: u.c }));
          canvas.appendChild(txt(x + 29, 118, u.en, { size: 13, fill: '#6b6b80' }));
        });
        if (t > 0.75) {
          canvas.appendChild(badge(70, 165, 220, 48, '#fff7e0', '#f4a261'));
          canvas.appendChild(txt(180, 186, '公里 = 千米', { size: 18, fill: '#c45c26' }));
          canvas.appendChild(txt(180, 205, '只是生活中的另一种叫法', { size: 12, fill: '#8a5a09' }));
        }
      }
    },
    /* 3 */
    {
      title: '感觉一下：毫米',
      duration: 11000,
      narr: '1 毫米特别短。手指甲大约厚 1 毫米，身份证也大约厚 1 毫米。量很短、或要量得很精确时，用毫米。',
      draw: function (t) {
        clear(); canvas.appendChild(defsCommon()); canvas.appendChild(bg());
        canvas.appendChild(xiaomei(45, 175, 0.95, 'think'));
        /* ID card */
        canvas.appendChild(el('g', { filter: 'url(#soft)' }, [
          el('rect', { x: '130', y: '70', width: '160', height: '95', rx: '10', fill: '#E8F4FF', stroke: '#1d6fa5', 'stroke-width': '3' }),
          el('rect', { x: '145', y: '88', width: '42', height: '52', rx: '4', fill: '#FFD8B0' }),
          el('rect', { x: '200', y: '90', width: '70', height: '8', rx: '2', fill: '#9ec5e8' }),
          el('rect', { x: '200', y: '108', width: '55', height: '8', rx: '2', fill: '#9ec5e8' }),
          el('rect', { x: '200', y: '126', width: '60', height: '8', rx: '2', fill: '#9ec5e8' })
        ]));
        if (t > 0.35) {
          /* thickness zoom */
          canvas.appendChild(el('rect', { x: '300', y: '70', width: '8', height: '95', rx: '2', fill: '#1d6fa5' }));
          canvas.appendChild(arrowH(312, 340, 118, '#2fa36b'));
          canvas.appendChild(txt(250, 200, '厚约 1 毫米', { size: 16, fill: '#2fa36b' }));
        }
        if (t > 0.6) {
          canvas.appendChild(badge(120, 220, 200, 36, '#eafaf1', '#2fa36b'));
          canvas.appendChild(txt(220, 244, '指甲 ≈ 1 毫米', { size: 15, fill: '#2fa36b' }));
        }
      }
    },
    /* 4 */
    {
      title: '感觉一下：厘米·分米',
      duration: 12000,
      narr: '1 厘米大约是手指最宽的那一节那么宽。10 厘米就是 1 分米——张开手，大约一掌宽。铅笔常用厘米量。',
      draw: function (t) {
        clear(); canvas.appendChild(defsCommon()); canvas.appendChild(bg());
        canvas.appendChild(xiaomei(40, 185, 0.9, 'happy'));
        /* finger ~1cm */
        canvas.appendChild(el('g', { filter: 'url(#soft)' }, [
          el('rect', { x: '100', y: '70', width: '28', height: '70', rx: '12', fill: '#FFE0BD', stroke: '#e0b890', 'stroke-width': '2' }),
          el('rect', { x: '104', y: '78', width: '20', height: '8', rx: '2', fill: '#f4c6a0', opacity: '0.6' })
        ]));
        canvas.appendChild(arrowH(100, 128, 55, '#c45c26'));
        canvas.appendChild(txt(114, 48, '≈1厘米', { size: 14, fill: '#c45c26' }));
        /* palm ~1dm */
        if (t > 0.35) {
          canvas.appendChild(el('g', { filter: 'url(#soft)' }, [
            el('ellipse', { cx: '250', cy: '115', rx: '55', ry: '40', fill: '#FFE0BD', stroke: '#e0b890', 'stroke-width': '2' }),
            el('rect', { x: '230', y: '145', width: '40', height: '35', rx: '8', fill: '#FFE0BD', stroke: '#e0b890', 'stroke-width': '2' })
          ]));
          canvas.appendChild(arrowH(195, 305, 70, '#8b5cf6'));
          canvas.appendChild(txt(250, 58, '≈1分米（10厘米）', { size: 14, fill: '#8b5cf6' }));
        }
        if (t > 0.7) {
          canvas.appendChild(badge(90, 210, 230, 40, '#fff', '#f1c26b'));

  /* ========== 播放控制 ========== */
  var idx = 0;
  var playing = true;
  var sceneStart = 0;
  var pausedAt = 0;
  var raf = 0;
  var finished = false;

  function buildDots() {
    progressEl.innerHTML = '';
    scenes.forEach(function (_, i) {
      var d = document.createElement('span');
      d.className = 'dot' + (i === idx ? ' on' : (i < idx ? ' done' : ''));
      d.title = '第 ' + (i + 1) + ' 幕 · ' + scenes[i].title;
      progressEl.appendChild(d);
    });
  }

  function setNarr() {
    var s = scenes[idx];
    sceneLabel.textContent = '第 ' + (idx + 1) + ' / ' + scenes.length + ' 幕 · ' + s.title;
    narrText.textContent = s.narr;
  }

  function showEnd(show) {
    finished = show;
    endOverlay.classList.toggle('show', show);
  }

  function goScene(i, keepTime) {
    idx = Math.max(0, Math.min(scenes.length - 1, i));
    sceneStart = performance.now() - (keepTime || 0);
    pausedAt = 0;
    showEnd(false);
    setNarr();
    buildDots();
    scenes[idx].draw(0);
  }

  function tick(now) {
    raf = 0;
    if (!playing || finished) return;
    var s = scenes[idx];
    var elapsed = now - sceneStart;
    var t = Math.min(1, elapsed / s.duration);
    s.draw(t);
    if (elapsed >= s.duration) {
      if (idx >= scenes.length - 1) {
        playing = false;
        btnPlay.textContent = '▶ 播放';
        btnPlay.setAttribute('aria-pressed', 'false');
        showEnd(true);
        buildDots();
        return;
      }
      goScene(idx + 1);
    }
    raf = requestAnimationFrame(tick);
  }

  function play() {
    if (finished) goScene(0);
    playing = true;
    btnPlay.textContent = '⏸ 暂停';
    btnPlay.setAttribute('aria-pressed', 'true');
    if (pausedAt) {
      sceneStart = performance.now() - pausedAt;
      pausedAt = 0;
    } else if (!sceneStart) {
      sceneStart = performance.now();
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function pause() {
    playing = false;
    btnPlay.textContent = '▶ 播放';
    btnPlay.setAttribute('aria-pressed', 'false');
    pausedAt = performance.now() - sceneStart;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  btnPlay.addEventListener('click', function () {
    if (playing) pause(); else play();
  });
  btnReplay.addEventListener('click', function () {
    goScene(0);
    play();
  });
  btnAgain.addEventListener('click', function () {
    goScene(0);
    play();
  });

  progressEl.addEventListener('click', function (e) {
    var dots = progressEl.querySelectorAll('.dot');
    for (var i = 0; i < dots.length; i++) {
      if (dots[i] === e.target) {
        goScene(i);
        if (playing) play();
        else scenes[idx].draw(0);
        break;
      }
    }
  });

  goScene(0);
  play();
})();
</script>
